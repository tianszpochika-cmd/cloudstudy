apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: englishflow-g4-boundary
  annotations:
    englishflow.io/external-entrypoint: api-gateway
    englishflow.io/direct-domain-ingress: denied
    englishflow.io/service-side-pep: required
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: englishflow
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api-gateway
  egress:
    - to:
        - namespaceSelector: {}
