apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: englishflow-b21-staging
  namespace: argocd
  labels:
    englishflow.dev/phase: phase-1
    englishflow.dev/environment: staging
spec:
  project: englishflow-phase-1
  source:
    repoURL: https://git.example.invalid/englishflow/cloudstudy
    targetRevision: REPLACE_RC_COMMIT_SHA
    path: deploy/b21/overlays/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: englishflow-staging
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=false
