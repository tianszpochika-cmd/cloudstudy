apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: englishflow-production
resources:
  - namespace.yaml
  - ../../base
commonLabels:
  environment: production
  englishflow.dev/promotion: manual
images:
  - name: registry.example.invalid/englishflow/api-gateway
    newName: registry.example.invalid/englishflow/api-gateway
    digest: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
patches:
  - path: deployment-patch.yaml
  - path: external-secret-patch.yaml
