apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: englishflow-runtime-secrets
spec:
  secretStoreRef:
    name: englishflow-staging-external-secrets
    kind: ClusterSecretStore
  data:
    - secretKey: database-password
      remoteRef:
        key: phase1/staging/englishflow-runtime
        property: database-password
    - secretKey: oidc-client-secret
      remoteRef:
        key: phase1/staging/englishflow-runtime
        property: oidc-client-secret
