apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: englishflow-runtime-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: englishflow-external-secrets
    kind: ClusterSecretStore
  target:
    name: englishflow-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: phase1/base/englishflow-runtime
        property: database-password
