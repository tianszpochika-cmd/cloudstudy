apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: englishflow-b22-production
  namespace: argocd
  labels:
    englishflow.dev/phase: phase-1
    englishflow.dev/environment: production
    englishflow.dev/release-batch: b22
  annotations:
    englishflow.dev/release-status: BLOCKED
    englishflow.dev/b21-gate: required-and-not-accepted
spec:
  project: englishflow-phase-1
  source:
    repoURL: https://git.example.invalid/englishflow/cloudstudy
    targetRevision: REPLACE_SIGNED_B22_COMMIT_SHA
    path: deploy/b22/overlays/production
    kustomize:
      commonAnnotations:
        englishflow.dev/source-revision: REPLACE_SIGNED_B22_COMMIT_SHA
  destination:
    server: https://kubernetes.default.svc
    namespace: englishflow-production
  syncPolicy:
    # No automated sync: an approved operator and an audit record are required.
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true

