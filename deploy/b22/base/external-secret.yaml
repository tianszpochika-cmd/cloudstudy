apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: englishflow-runtime-secrets
  labels:
    app.kubernetes.io/part-of: englishflow
    app.kubernetes.io/release-batch: b22
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: englishflow-production-external-secrets
    kind: ClusterSecretStore
  target:
    name: englishflow-runtime-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-password
      remoteRef:
        key: phase1/production/englishflow-runtime
        property: database-password
    - secretKey: oidc-client-secret
      remoteRef:
        key: phase1/production/englishflow-runtime
        property: oidc-client-secret

