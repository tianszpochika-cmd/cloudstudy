apiVersion: v1
kind: Service
metadata:
  name: api-gateway-stable
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/track: stable
  annotations:
    rollouts.argoproj.io/managed-by: argo-rollouts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-canary
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/track: canary
  annotations:
    rollouts.argoproj.io/managed-by: argo-rollouts
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

