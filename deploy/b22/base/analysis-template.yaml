apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: b22-canary-health
  labels:
    app.kubernetes.io/part-of: englishflow
    app.kubernetes.io/release-batch: b22
  annotations:
    englishflow.dev/evidence-mode: static-template-only
    englishflow.dev/runtime-evidence: external-runner-required
spec:
  args:
    - name: b21-gate-decision
      value: BLOCKED
    - name: release-gate-decision
      value: NO-GO
    - name: metrics-endpoint
      value: REPLACE_WITH_APPROVED_OTEL_QUERY_ENDPOINT
  metrics:
    - name: gateway-success-rate
      interval: 1m
      failureLimit: 1
      inconclusiveLimit: 1
      provider:
        prometheus:
          address: REPLACE_WITH_APPROVED_METRICS_ENDPOINT
          query: >-
            sum(rate(http_server_request_duration_seconds_count{service="api-gateway",status=~"2.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{service="api-gateway"}[5m]))
    - name: gateway-error-rate
      interval: 1m
      failureLimit: 1
      inconclusiveLimit: 1
      provider:
        prometheus:
          address: REPLACE_WITH_APPROVED_METRICS_ENDPOINT
          query: >-
            sum(rate(http_server_request_duration_seconds_count{service="api-gateway",status=~"5.."}[5m]))
            / sum(rate(http_server_request_duration_seconds_count{service="api-gateway"}[5m]))
    - name: business-smoke-result
      interval: 1m
      count: 1
      failureLimit: 1
      provider:
        job:
          metadata:
            name: REPLACE_WITH_SYNTHETIC_OR_APPROVED_SMOKE_JOB
          spec:
            backoffLimit: 0
            template:
              spec:
                restartPolicy: Never
                containers:
                  - name: smoke-runner
                    image: registry.example.invalid/englishflow/synthetic-smoke@sha256:2222222222222222222222222222222222222222222222222222222222222222
                    imagePullPolicy: IfNotPresent
                    securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: true

