<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理送审 · 静态稿</title><style>:root{--bg:#f7f5fb;--card:#fff;--ink:#231a33;--mut:#6f6480;--brand:#5b2fd6;--line:#e7e1f5;--ok:#1d9e6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:720px;margin:0 auto;padding:28px 20px}h1{font-size:22px}.flow{display:flex;gap:6px;margin:14px 0;flex-wrap:wrap}.flow span{padding:6px 12px;border-radius:20px;background:#efeaf9;font-size:13px}.flow span.on{background:var(--brand);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}.card b{font-size:15px}.meta{color:var(--mut);font-size:13px;margin:4px 0 10px}button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;margin-right:8px}button.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.log{font-size:13px;color:var(--ok);margin-top:8px;min-height:20px}.note{font-size:12px;color:var(--mut)}</style></head><body><div class="wrap"><h1>📝 内容送审（简审档：1 人可发＋留痕）</h1><div class="flow" id="flow"><span class="on">草稿</span><span>送审</span><span>L1 初审</span><span>L2 终审</span><span>发布</span></div><div class="card"><b>语法课 · There be 句型（v3）</b><div class="meta">版本 v3 · 版权已绑定 · 审核报告已绑定 · 缺项：无，可送审</div><button class="pri" onclick="step(1)">提交送审</button><button onclick="step(4)">直接发布（简审）</button></div><div class="card"><b>发布预览</b><div class="meta">目录实时预览：发布后学员书架可见</div><button class="pri" onclick="step(4)">发布</button><button onclick="step(5)">下架</button><button onclick="alert('已回滚到 v1（演示）')">回滚 v1</button></div><div class="log" id="log"></div><p class="note">IC-040/041/042 · 缺项一次说清；申请人禁自审（演示略）；回滚有确认。</p></div><script>const F=["草稿","送审","L1 初审","L2 终审","发布"];let s=0;function step(n){s=n;[...document.getElementById("flow").children].forEach((x,i)=>x.classList.toggle("on",i<=s));document.getElementById("log").textContent="✓ 已推进到「"+F[s]+"」（静态演示）"}</script></body></html>
