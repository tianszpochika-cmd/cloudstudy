<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>练题判分 · 静态稿</title><style>:root{--bg:#faf8ff;--card:#fff;--ink:#231a33;--mut:#6f6480;--brand:#5b2fd6;--line:#e7e1f5;--ok:#1d9e6b;--bad:#d64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:600px;margin:0 auto;padding:28px 20px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}h2{margin:0 0 14px;font-size:20px}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.opt.sel{border-color:var(--brand);background:#f3edff}.fb{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}.fb.ok{display:block;background:#e9f7f0;color:var(--ok)}.fb.no{display:block;background:#fdeeee;color:var(--bad)}.btn{display:block;width:100%;margin-top:14px;padding:12px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-size:16px;cursor:pointer}.note{font-size:12px;color:var(--mut);margin-top:14px}</style></head><body><div class="wrap"><div class="card"><h2>There ___ two books on the desk.</h2><div id="opts"></div><div class="fb" id="fb"></div><button class="btn" onclick="submit()">提交判分</button></div><p class="note">IC-022 · 行内判分不跳页；错进错题本（演示：选错显示入本）。</p></div><script>const O=["is","are","am"],A=1;let sel=null;const w=document.getElementById("opts");O.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent="ABC"[k]+". "+t;b.onclick=()=>{sel=k;[...w.children].forEach((x,j)=>x.classList.toggle("sel",j===k))};w.appendChild(b)});function submit(){if(sel==null){alert("先选一个");return}const f=document.getElementById("fb"),ok=sel===A;f.textContent=ok?"✓ FULL：主语复数用 are":"! ZERO：已进错题本，变式稍后见";f.className="fb "+(ok?"ok":"no")}</script></body></html>
