<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定级答题 · 静态稿</title><style>:root{--bg:#faf8ff;--card:#fff;--ink:#231a33;--mut:#6f6480;--brand:#5b2fd6;--line:#e7e1f5;--ok:#1d9e6b;--bad:#d64545}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:600px;margin:0 auto;padding:28px 20px}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}h2{margin:0 0 14px;font-size:20px}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;cursor:pointer}.opt.sel{border-color:var(--brand);background:#f3edff}.fb{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}.fb.ok{display:block;background:#e9f7f0;color:var(--ok)}.fb.no{display:block;background:#fdeeee;color:var(--bad)}.row{display:flex;gap:10px;margin-top:14px}.btn{flex:1;padding:12px;border-radius:10px;border:0;background:var(--brand);color:#fff;font-size:16px;cursor:pointer}.btn.ghost{background:#efeaf9;color:var(--brand)}.note{font-size:12px;color:var(--mut);margin-top:14px}</style></head><body><div class="wrap"><div class="meta"><span id="step">第 1/3 题（演示 3 道，实物 10 道）</span><span> vocab · A1</span></div><div class="card"><h2 id="stem"></h2><div id="opts"></div><div class="fb" id="fb"></div><div class="row"><button class="btn ghost" onclick="next()">下一题 →</button><button class="btn" onclick="submit()">提交</button></div></div><p class="note">IC-010/011 · 行内即时反馈；答案规则在服务端，静态稿只演示对错态。</p></div><script>const DATA=[{s:"Choose the word closest in meaning to 'happy'.",o:["glad","angry","tired"],a:0},{s:"She ___ to school every day.",o:["go","goes","going"],a:1},{s:"Li Lei gets up at six thirty. What time does he get up?",o:["six thirty","seven","eight"],a:0}];let i=0,sel=null,score=0;function render(){document.getElementById("step").textContent=`第 ${i+1}/3 题（演示 3 道，实物 10 道）`;document.getElementById("stem").textContent=DATA[i].s;const w=document.getElementById("opts");w.innerHTML="";document.getElementById("fb").className="fb";sel=null;DATA[i].o.forEach((t,k)=>{const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+k)+". "+t;b.onclick=()=>{sel=k;[...w.children].forEach((x,j)=>x.classList.toggle("sel",j===k))};w.appendChild(b)})}function submit(){if(sel==null){alert("先选一个");return}const f=document.getElementById("fb"),ok=sel===DATA[i].a;if(ok)score++;f.textContent=ok?"✓ 对了，词汇不错":"! 再想想：第 "+(i+1)+" 题先记下，变式稍后见";f.className="fb "+(ok?"ok":"no")}function next(){if(i<2){i++;render()}else{alert(`演示结束：${score}/3。实物出报告卡→生成计划。`)}}render()</script></body></html>
