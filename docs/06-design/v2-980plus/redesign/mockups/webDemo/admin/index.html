<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>语学星 · 管理端静态 Demo（桌面）</title>
<style>
:root{--bg:#f4f1fa;--card:#fff;--ink:#231a33;--mut:#6f6480;--brand:#5b2fd6;--brand2:#8b5cf6;--line:#e7e1f5;--ok:#1d9e6b;--bad:#d64545;--warn:#b7791f;--side:#161022;--side2:#241b38}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
.demo-banner{background:#fff7e6;color:var(--warn);border-bottom:1px solid #f0d9a8;padding:8px 16px;font-size:13px;font-weight:700;text-align:center}
.demo-banner a{color:var(--brand)}
.app{display:flex;min-height:calc(100vh - 36px)}
.sidebar{width:232px;flex:none;background:linear-gradient(180deg,var(--side),var(--side2));color:#f3edff;display:flex;flex-direction:column;padding:16px 12px}
.brand{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:flex;align-items:center;justify-content:center;font-weight:800}
.brand b{display:block;font-size:14px}.brand small{color:#b9aed2;font-size:11px}
.nav-sec{margin:12px 8px 4px;font-size:11px;letter-spacing:.08em;color:#9b8fb8;font-weight:700}
#tabs{display:flex;flex-direction:column;gap:2px;flex:1}
#tabs a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;color:#e8dffc;text-decoration:none;font-size:13.5px}
#tabs a i{font-style:normal;width:1.4em;text-align:center}
#tabs a.on{background:rgba(139,92,246,.28);color:#fff;font-weight:700}
#tabs a:hover{background:rgba(255,255,255,.06)}
.side-extra{display:flex;flex-direction:column;gap:2px;padding-top:8px;border-top:1px solid rgba(255,255,255,.08);margin-top:8px}
.side-extra a{display:block;padding:8px 10px;border-radius:10px;color:#cbbdf0;text-decoration:none;font-size:13px}
.side-extra a:hover{background:rgba(255,255,255,.06)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:16px 24px 8px;background:transparent;border:0;min-height:auto}
.topbar .bk{border:0;background:#efeaf9;color:var(--brand);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.topbar b{font-size:22px}
.topbar .sp{flex:1}
.topbar .meta{font-size:12px;color:var(--mut);background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
#view{flex:1;overflow:auto;padding:8px 24px 40px;max-width:1100px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 8px 24px rgba(91,47,214,.04)}
.card h2{margin:0 0 6px;font-size:18px}.card p.d{color:var(--mut);font-size:13px;margin:0 0 10px}
.btn{display:inline-block;width:auto;padding:10px 16px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;margin:6px 6px 0 0;cursor:pointer;text-decoration:none;text-align:center;font-weight:600}
.btn.ghost{background:#efeaf9;color:var(--brand)}.btn.danger{background:var(--bad);color:#fff}
.btn.sm{padding:8px 14px;font-size:13px;background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.sm:disabled{opacity:.45}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:4px 0 8px;background:#fff;color:var(--ink);font:inherit}
textarea{min-height:76px;resize:vertical}label.lb{display:block;font-weight:600;margin:10px 0 2px;font-size:14px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer}
.opt.sel{border-color:var(--brand);background:#f3edff}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}.fb.ok{background:#e9f7f0;color:var(--ok)}.fb.no{background:#fdeeee;color:var(--bad)}.fb.wa{background:#fff7e6;color:var(--warn)}
.meta{font-size:12px;color:var(--mut)}.tag{display:inline-block;font-size:11px;background:#efeaf9;color:var(--brand);border-radius:12px;padding:2px 10px;margin:2px 4px 2px 0}
.tag.ok{background:#e9f7f0;color:var(--ok)}.tag.no{background:#fdeeee;color:var(--bad)}.tag.wa{background:#fff7e6;color:var(--warn)}
.empty{border-style:dashed;text-align:center}.kpis{display:flex;gap:8px;margin:10px 0}
.kpis>div{flex:1;background:#f3edff;border-radius:10px;padding:8px 6px;text-align:center}.kpis b{display:block;font-size:18px}.kpis span{font-size:11px;color:var(--mut)}
.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.rowline:last-child{border-bottom:0}.rowline>div{min-width:0}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#231a33;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:88%;z-index:40}
.toast.show{opacity:1}:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.auth-wrap{max-width:420px;margin:48px auto}
body.auth-mode .sidebar{display:none}
body.auth-mode .app{display:block}
@media(max-width:860px){.app{flex-direction:column}.sidebar{width:100%}}
</style>
</head>
<body>
<div class="demo-banner">静态演示 / 假数据 · 不连正式后端 · <a href="../">返回枢纽</a></div>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">管</span><div><b>语学星管理</b><small>桌面 Demo</small></div></div>
    <div class="nav-sec">主导航</div>
    <nav class="tabbar" id="tabs">
      <a href="#/dash" data-t="dash"><i>📊</i>工作台</a>
      <a href="#/draft" data-t="draft"><i>📝</i>内容</a>
      <a href="#/gov" data-t="gov"><i>🛡️</i>治理</a>
      <a href="#/me" data-t="me"><i>👤</i>我的</a>
    </nav>
    <div class="side-extra">
      <div class="nav-sec">更多</div>
      <a href="#/review">双签审核</a>
      <a href="#/publish">发布回滚</a>
      <a href="#/media">媒体</a>
      <a href="#/cs">客服</a>
      <a href="#/shop">商城</a>
      <a href="#/refund">退款</a>
      <a href="#/audit">审计</a>
      <a href="#/perm">权限</a>
      <a href="#/ops">观测门</a>
      <a href="#/report">举报</a>
    </div>
  </aside>
  <div class="main">
    <div class="topbar"><button class="bk" id="bk" aria-label="返回" onclick="agoBack()">‹</button><b id="title">管理后台</b><span class="sp"></span><span class="meta" id="net">演示·无后端</span></div>
    <div id="view"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
<script>
/* Desktop shell helpers: hide sidebar on login; keep A_TABS logic from app.js */
(function(){
  const _arender = window.arender;
  if (typeof _arender !== "function") return;
  window.arender = function(){
    _arender();
    const r = (location.hash || "#/dash").replace("#/", "");
    document.body.classList.toggle("auth-mode", r === "alogin" || !window.A || !A.user);
    document.querySelectorAll(".side-extra a").forEach(a => {
      a.style.fontWeight = a.getAttribute("href") === "#/" + r ? "700" : "";
      a.style.color = a.getAttribute("href") === "#/" + r ? "#fff" : "";
    });
  };
  window.arender();
})();
</script>
</body>
</html>
