<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>语学星 · 管理后台交互稿</title><style>:root{--bg:#f4f1fa;--card:#fff;--ink:#231a33;--mut:#6f6480;--brand:#5b2fd6;--brand2:#8b5cf6;--line:#e7e1f5;--ok:#1d9e6b;--bad:#d64545;--warn:#b7791f}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{margin:0;background:#e9e4f3;color:var(--ink);font:15px/1.65 system-ui,"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;display:flex;justify-content:center}.phone{width:min(430px,100%);height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}@media(min-width:500px){.phone{height:min(900px,94dvh);margin-top:3dvh;border-radius:28px;box-shadow:0 24px 80px rgba(60,30,120,.25)}}.topbar{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--card);border-bottom:1px solid var(--line);min-height:52px}.topbar .bk{border:0;background:none;font-size:20px;cursor:pointer;color:var(--brand);min-width:36px}.topbar b{font-size:16px}.topbar .sp{flex:1}.topbar .meta{font-size:12px;color:var(--mut)}#view{flex:1;overflow-y:auto;padding:16px 14px 90px}.tabbar{position:absolute;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(8px + env(safe-area-inset-bottom))}.tabbar a{flex:1;text-align:center;text-decoration:none;color:var(--mut);font-size:11px}.tabbar a.on{color:var(--brand);font-weight:700}.tabbar a i{display:block;font-style:normal;font-size:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}.card h2{margin:0 0 6px;font-size:18px}.card p.d{color:var(--mut);font-size:13px;margin:0 0 10px}.btn{display:block;width:100%;padding:12px;border:0;border-radius:11px;background:var(--brand);color:#fff;font-size:16px;margin-top:10px;cursor:pointer;text-decoration:none;text-align:center}.btn.ghost{background:#efeaf9;color:var(--brand)}.btn.danger{background:var(--bad);color:#fff}.btn.sm{width:auto;display:inline-block;padding:9px 18px;font-size:14px;font-weight:600;margin:6px 6px 0 0;background:#fff;color:var(--ink);border:1px solid var(--line);cursor:pointer}.btn.sm.pri{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.sm:disabled{opacity:.45}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:15px;margin:4px 0 8px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:76px;resize:vertical}label.lb{display:block;font-weight:600;margin:10px 0 2px;font-size:14px}.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;cursor:pointer}.opt.sel{border-color:var(--brand);background:#f3edff}.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:14px}.fb.ok{background:#e9f7f0;color:var(--ok)}.fb.no{background:#fdeeee;color:var(--bad)}.fb.wa{background:#fff7e6;color:var(--warn)}.meta{font-size:12px;color:var(--mut)}.tag{display:inline-block;font-size:11px;background:#efeaf9;color:var(--brand);border-radius:12px;padding:2px 10px;margin:2px 4px 2px 0}.tag.ok{background:#e9f7f0;color:var(--ok)}.tag.no{background:#fdeeee;color:var(--bad)}.tag.wa{background:#fff7e6;color:var(--warn)}.empty{border-style:dashed;text-align:center}.kpis{display:flex;gap:8px;margin:10px 0}.kpis>div{flex:1;background:#f3edff;border-radius:10px;padding:8px 6px;text-align:center}.kpis b{display:block;font-size:18px}.kpis span{font-size:11px;color:var(--mut)}.rowline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.rowline:last-child{border-bottom:0}.rowline>div{min-width:0}.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:#231a33;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;max-width:88%}.toast.show{opacity:1}:focus-visible{outline:2px solid var(--brand);outline-offset:2px}</style></head><body><div class="phone"><div class="topbar"><button class="bk" id="bk" aria-label="返回" onclick="goBack()">‹</button><b id="title">管理后台</b><span class="sp"></span><span class="meta">演示·无后端</span></div><div id="view"></div><nav class="tabbar" id="tabs"><a href="#/dash" data-t="dash"><i>📊</i>工作台</a><a href="#/draft" data-t="draft"><i>📝</i>内容</a><a href="#/gov" data-t="gov"><i>🛡️</i>治理</a><a href="#/me" data-t="me"><i>👤</i>我的</a></nav><div class="toast" id="toast" role="status" aria-live="polite"></div></div><script src="app.js"></script></body></html>
