<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入门向导 · 静态稿</title><style>:root{--bg:#faf8ff;--card:#fff;--ink:#231a33;--mut:#6f6480;--brand:#5b2fd6;--line:#e7e1f5;--ok:#1d9e6b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:560px;margin:0 auto;padding:28px 20px}.steps{display:flex;gap:8px;margin:0 0 20px}.steps i{flex:1;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--brand)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}h1{font-size:24px;margin:0 0 6px}.lead{color:var(--mut);margin:0 0 16px}label{display:block;margin:12px 0 4px;font-weight:600}input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px}.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.check input{width:auto;margin-top:6px}.btn{display:block;width:100%;margin-top:18px;padding:13px;background:var(--brand);color:#fff;border:0;border-radius:12px;font-size:17px;cursor:pointer}.btn:disabled{opacity:.45}.back{display:block;text-align:center;margin-top:12px;color:var(--mut);font-size:14px}.note{font-size:12px;color:var(--mut);margin-top:14px}.ok{display:none;margin-top:12px;color:var(--ok);font-weight:600}</style></head><body><div class="wrap"><div class="steps"><i class="on"></i><i></i><i></i></div><div class="card" id="s1"><h1>先讲一句：为什么要生日</h1><p class="lead">语学星只服务成年人，确认一下就放行，信息只用来判定，不做别的。</p><label>出生年份</label><input id="by" type="number" value="1995" min="1900" max="2008"><div class="check"><input type="checkbox" id="c1" checked><label for="c1">我已满 18 岁（静态演示，默认勾选）</label></div><button class="btn" onclick="go2()">继续：看三项同意</button><p class="note">IC-055 · 门说明先行，拒绝给退出键（演示略）。</p></div><div class="card" id="s2" style="display:none"><h1>三项同意，逐项签</h1><p class="lead">每项点开看一行用途，签完再生效（动态版本号，演示写死 test-doc）。</p><div class="check"><input type="checkbox" class="ag" checked><label>服务条款：用来提供学习服务</label></div><div class="check"><input type="checkbox" class="ag" checked><label>隐私说明：数据怎么存、怎么删</label></div><div class="check"><input type="checkbox" class="ag" checked><label>成人学习：确认以成人身份学习</label></div><button class="btn" onclick="go3()">继续：选学习目标</button><p class="note">IC-056 · 可选项不预勾；撤回随时在设置里。</p></div><div class="card" id="s3" style="display:none"><h1>定个小目标</h1><p class="lead">先选一个，一周后可换。</p><label>目标</label><select id="goal"><option>大学英语四级 · B1</option><option>零基础 · A1</option><option>六级 · B2</option></select><label>每天分钟</label><select id="min"><option>15</option><option>30</option><option>45</option></select><button class="btn" onclick="done()">保存，去定级 →</button><p class="ok" id="ok">✓ 已保存（静态演示）。下一步：定级 10 道题，约 3 分钟。</p><p class="note">IC-057/004 · 按钮去定级，不回首页。</p></div></div><script>const S=["s1","s2","s3"],B=document.querySelectorAll(".steps i");function show(n){S.forEach((id,i)=>{document.getElementById(id).style.display=i===n?"block":"none";B[i].className=i<=n?"on":""})}function go2(){show(1)}function go3(){const a=[...document.querySelectorAll(".ag")];if(!a.every(x=>x.checked)){alert("三项都要签才能继续（演示规则）");return}show(2)}function done(){document.getElementById("ok").style.display="block"}</script></body></html>
