  downloads:['离线学习','已下载内容',[['book','日常英语 · 第 1 单元','教材 2.4 MB · 已就绪'],['headphones','一杯咖啡的对话','音频 4.8 MB · 已就绪'],['repeat','学习进度','暂无待同步记录']],'离线记录将在恢复连接后同步；同步成功前不会算作服务端完成。本页为示例状态。'],
  benefits:['我的学习权益','当前学习权益',[['check','基础学习','词汇复习、基础课程与学习记录'],['star','权益兑换','支持有效兑换码，需连接账户校验']],'订阅与兑换以实际权益和开放范围为准。本稿不开放支付或兑换操作。'],
  help:['帮助与反馈','常见问题',[['repeat','学习记录没有更新？','恢复网络后，在离线学习查看同步状态。'],['clock','自习室为什么没有计时？','提前结束或未完成的专注不会结算。'],['info','如何反馈问题？','正式端由客服入口提交问题并查看处理进度。']],'本稿只演示帮助内容，不会向客服或其他用户发送消息。'],
  'data-export':['导出学习数据','申请前了解',[['book','可申请的数据','个人资料、学习历史与进度记录'],['user','身份验证','验证本人身份后提交申请'],['clock','查看与下载','在账户中查看处理状态及下载有效期']],'设计流程说明，尚未发起任何导出请求。'],
  'delete-info':['账户注销','注销前确认',[['info','核对未完成事项','检查权益、订单和待处理申请'],['user','验证账户身份','核实本人意愿与账户所有权'],['clock','查看处理状态','以实际保留规则和确认结果为准']],'此稿仅说明流程，没有执行注销。正式产品须展示数据处理范围与可撤回规则。']
 };
 if(info[action]){const [title,heading,rows,desc]=info[action];details(title,`<p>${heading}</p>${rows.map(([i,t,s])=>`<div class="info-row"><span class="menu-icon">${I(i)}</span><span class="row-copy"><strong>${t}</strong><small>${s}</small></span></div>`).join('')}<p class="detail-hint">${desc}</p>`);return true;}
 return false;
}
setInterval(()=>{if(!demo.focus)return;demo.focusSeconds=Math.max(0,demo.focusSeconds-1);document.querySelectorAll('[data-focus-time]').forEach(el=>el.textContent=formatTime(demo.focusSeconds));if(demo.focusSeconds===0){demo.focus=false;demo.joined=false;render();if(demo.screen===5)toast('专注演示结束，没有生成真实学习记录。')}},1000);

const renderers=[home,course,vocab,listening,report,room,world,me,game,settings];
function phone(n){return `<article class="phone" data-screen="${n}" aria-label="${names[n]}">${renderers[n]()}</article>`}
function renderBoard(){const pages=demo.group==='learning'?[0,1,2,3,4]:[6,5,8,7,9];document.getElementById('board').innerHTML=pages.map((i,displayIndex)=>`<div class="screen-unit"><div class="screen-caption"><span class="num">${String(displayIndex+(demo.group==='learning'?1:6)).padStart(2,'0')}</span><h2>${names[i]}</h2><small>${['HOME','COURSE','RECALL','LISTEN','REFLECT','FOCUS','WORLD','PROFILE','PLAY','SETTINGS'][i]}</small></div>${phone(i)}</div>`).join('')}

function renderSingle(){document.getElementById('single-phone').innerHTML=phone(demo.screen);document.getElementById('screen-picker').innerHTML=[0,1,2,3,4,6,5,8,7,9].map((i,displayIndex)=>`<button class="${demo.screen===i?'active':''}" data-action="go" data-to="${i}" ${demo.screen===i?'aria-current="page"':''}><span class="pick-num">${String(displayIndex+1).padStart(2,'0')}</span>${names[i]}</button>`).join('');document.getElementById('note-title').textContent=notes[demo.screen][0];document.getElementById('note-copy').textContent=notes[demo.screen][1];document.getElementById('note-actions').textContent=notes[demo.screen][2];document.getElementById('offline-toggle').textContent=demo.offline?'恢复在线预览':'查看首页离线状态'}
function render(){if(demo.mode==='board')renderBoard();else renderSingle()}
function setMode(mode){demo.mode=mode;document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===mode);b.setAttribute('aria-pressed',String(b.dataset.mode===mode))});document.getElementById('board').style.display=mode==='board'?'grid':'none';document.getElementById('single-area').style.display=mode==='single'?'block':'none';render()}
function go(n){demo.screen=n;if(n===2||n===3)demo.sessionStarted=true;demo.playing=false;setMode('single')}
function activePhone(){return document.querySelector(demo.mode==='single'?'#single-phone .phone':`#board .phone[data-screen="${demo.screen}"]`)}
function toast(message){const p=activePhone();if(!p)return;p.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=message;p.append(el);clearTimeout(demo.toastTimer);demo.toastTimer=setTimeout(()=>el.remove(),3300)}
function sheet(title,message,button,action,secondary='继续学习'){const p=activePhone();const s=document.createElement('div');s.className='sheet-scrim';s.innerHTML=`<section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-handle"></div><h3>${title}</h3><p>${message}</p><button class="primary" data-action="${action}">${button}</button><button class="secondary" data-action="dismiss">${secondary}</button></section>`;p.append(s);s.querySelector('button').focus();s.addEventListener('keydown',e=>{if(e.key==='Escape'){s.remove();return}if(e.key==='Tab'){const bs=[...s.querySelectorAll('button')];if(e.shiftKey&&document.activeElement===bs[0]){e.preventDefault();bs.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===bs.at(-1)){e.preventDefault();bs[0].focus()}}})}
function formatTime(s){return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`}
document.addEventListener('click',e=>{const theme=e.target.closest('[data-theme-choice]');if(theme){applyTheme(theme.dataset.themeChoice);return;}const mode=e.target.closest('[data-mode]');if(mode){setMode(mode.dataset.mode);return}const b=e.target.closest('[data-action]');if(!b)return;const p=b.closest('[data-screen]');if(p)demo.screen=Number(p.dataset.screen);const action=b.dataset.action;
 if(extraAction(action,b))return;
 if(action==='go')go(Number(b.dataset.to));
 else if(action==='nav')go(Number(b.dataset.to));
 else if(action==='review'){demo.wordIndex=0;demo.revealed=false;demo.ratings=[];demo.done=false;go(2)}
 else if(action==='reveal'){demo.revealed=true;if(demo.mode==='board')go(2);else renderSingle()}
 else if(action==='rate'){demo.ratings.push(Number(b.dataset.rating));if(demo.wordIndex<2){demo.wordIndex++;demo.revealed=false;render()}else{if(demo.mode==='board')go(2);sheet('词汇复习，完成了。','三个示例词已完成。接下来听一小段日常对话，把学习继续下去。','继续听力精练','next-listen','先看学习小结');const s=activePhone().querySelector('.sheet .secondary');s.dataset.action='summary'}}
 else if(action==='next-listen')go(3);
 else if(action==='exit'){if(demo.mode==='board')go(2);sheet('暂停一下，也没关系。','当前演示会保留这一页的回忆进度。回到首页后，可以继续这次练习。','保存进度并离开','home','继续复习')}
 else if(action==='home'){go(0)}
 else if(action==='home-done'){demo.done=demo.ratings.length===3&&demo.listeningDone;go(0)}
 else if(action==='dismiss'){b.closest('.sheet-scrim').remove()}
 else if(action==='play'){demo.playing=!demo.playing;render()}
 else if(action==='speed'){demo.speed=({1:1.25,1.25:1.5,1.5:.75,.75:1})[demo.speed]||1;render()}
 else if(action==='loop'){demo.loop=!demo.loop;render()}
 else if(action==='translation'){demo.translation=!demo.translation;render()}
 else if(action==='rewind'){demo.seconds=Math.max(0,demo.seconds-10);render()}
 else if(action==='forward'){demo.seconds=Math.min(96,demo.seconds+10);render()}
 else if(action==='summary'){go(4)}else if(action==='finish'){demo.sessionStarted=true;demo.listeningDone=true;demo.done=demo.ratings.length===3;go(4)}
 else if(action==='messages'){if(demo.mode==='board')go(0);sheet('今天，有一份复习等你。','3 个词到了复习时间。给熟悉的表达一次再次见面的机会。','开始词汇复习','review','稍后再看')}
 else if(action==='pronounce')toast('发音按钮交互预览；本设计稿未接入真实音频。');
 else if(action==='session-help')toast('先回忆，后查看释义，再按真实感受选择回忆程度。');
 else if(action==='more')toast('这是移动端双主题交互提案，页面内容、成长数据与学习结果均为示例。');
});
document.getElementById('offline-toggle').addEventListener('click',()=>{demo.offline=!demo.offline;go(0)});
document.getElementById('reset-demo').addEventListener('click',()=>{Object.assign(demo,{wordIndex:0,revealed:false,ratings:[],playing:false,seconds:18,speed:1,translation:true,loop:false,offline:false,done:false,sessionStarted:false,listeningDone:false,goal:15,accent:'美式',roomMinutes:25,focus:false,focusSeconds:1500,joined:false,encouragement:'',train:[],trainChecked:false,leaderboard:true,reminder:true,avatar:'orbit',nickname:'星辰'});go(0);toast('演示进度已重置')});
setInterval(()=>{if(!demo.playing)return;demo.seconds++;if(demo.loop&&demo.seconds>25)demo.seconds=18;if(demo.seconds>=96){demo.seconds=96;demo.playing=false}const p=demo.mode==='single'?document.querySelector('#single-phone [data-screen="3"]'):document.querySelector('#board [data-screen="3"]');if(p){p.querySelector('[data-time]').textContent=formatTime(demo.seconds);p.querySelectorAll('.waveform i').forEach((bar,i)=>bar.classList.toggle('played',i<demo.seconds/96*52));if(!demo.playing)render()}},1000);
try{const saved=localStorage.getItem('yx-design-theme');if(saved==='dark'||saved==='light')demo.theme=saved}catch{}
applyTheme(demo.theme);
})();
</script>
