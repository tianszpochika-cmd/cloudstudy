<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>语学星官网提案 06 · 设计总览</title><style>
*{box-sizing:border-box}body{margin:0;background:#eeeff5;color:#242637;font-family:"Segoe UI","Microsoft YaHei",sans-serif;padding:42px}.wrap{max-width:1250px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:30px;margin-bottom:28px}h1{font-size:30px;font-weight:600;line-height:1.5;margin:8px 0}p{font-size:13px;line-height:1.8;color:#686d80;margin:0}.eyebrow{font-size:11px;letter-spacing:.15em;color:#5937d1}a{color:#5937d1;text-decoration:none;font-size:13px;display:inline-flex;min-height:44px;align-items:center}button{font:inherit;border:1px solid #dddcea;min-height:40px;background:#fff;color:#5937d1;cursor:pointer;padding:8px 16px;border-radius:24px;font-size:12px}button[aria-pressed=true]{background:#5937d1;color:white;border-color:#5937d1}.tools{display:flex;gap:10px;align-items:center}.mobiles{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}figure{margin:0}figcaption{display:flex;align-items:baseline;gap:10px;font-size:14px;margin:0 4px 14px}figcaption span{font-family:Georgia,serif;font-style:italic;color:#686d80;font-size:22px}figcaption small{font-size:10px;font-weight:400;color:#686d80;margin-left:auto}img{display:block;width:100%;border:1px solid #dddfea;border-radius:27px;box-shadow:0 16px 42px -28px #32294e44}.desktop{margin-top:46px}.desktop img{border-radius:16px}.desktop figcaption{font-size:15px}.notes{padding-top:30px;font-size:12px;color:#686d80;line-height:1.8}body[data-theme=dark]{background:#11131c;color:#f4f6ff}body[data-theme=dark] p,body[data-theme=dark] .notes{color:#b2b7cd}body[data-theme=dark] button{background:#222638;border-color:#363b50;color:#c3b5fa}body[data-theme=dark] button[aria-pressed=true]{background:#5937d1;color:#fff}body[data-theme=dark] img{border-color:#363b50}body[data-theme=dark] a,body[data-theme=dark] .eyebrow{color:#c3b5fa}@media(max-width:700px){body{padding:24px 16px}header{display:block}h1{font-size:25px}.tools{margin-top:20px}.mobiles{grid-template-columns:1fr;gap:29px;m </style></head><body><div class="wrap"><header><div><span class="eyebrow">YUXUEXING · OFFICIAL WEBSITE · 06</span><h1>同一种紫色，更轻松的开始。</h1><p>初期免费 · 第一阶段学习功能 · 手机访问优先</p></div><div class="tools"><button data-theme-choice="light" aria-pressed="true">浅色</button><button data-theme-choice="dark" aria-pressed="false">深色</button><a href="./">打开可点击官网 →</a></div></header><section class="mobiles"><figure><figcaption><span>01</span>官网首页<small>390 × 844</small></figcaption><img data-shot="mobile-home" src="screenshots/mobile-home-light.png" width="390" height="844" alt="手机访问官网首页"></figure><figure><figcaption><span>02</span>学习内容<small>390 × 844</small></figcaption><img data-shot="mobile-content" src="screenshots/mobile-content-light.png" width="390" height="844" alt="手机浏览学习内容"></figure><figure><figcaption><span>03</span>免费开始<small>390 × 844</small></figcaption><img data-shot="mobile-start" src="screenshots/mobile-start-light.png" width="390" height="844" alt="手机免费开始页"></figure></section><p style="margin-top:25px"><a href="world-overview.html">查看本轮：个人空间、拼句游戏与角色墙 →</a></p><section class="desktop"><figure><figcaption><span>04</span>桌面首屏<small>1440 × 1000</small></figcaption><img data-shot="desktop-hero" src="screenshots/desktop-hero-light.png" width="1440" height="1000" alt="电脑访问官网首页"></figure></section><p class="notes">独立 UI/UX 设计提案。提供十四类响应式页面、内容筛选与搜索、公开示例、帮助与学习端衔接。所有业务和开放安排仍需正式上线确认。</p></div><script>document.querySelectorAll('[data-theme-choice]').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.themeChoice;document.body.dataset.theme=t;document.querySelectorAll('[data-theme-choice]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('[data-shot]').forEach(i=>i.src='screenshots/'+i.dataset.shot+'-'+t+'.png')}));</script></body></html>
