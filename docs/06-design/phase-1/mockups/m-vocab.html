<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语学星 · 移动端 词汇学习页（背词会话）v0.1</title>
<link rel="stylesheet" href="tokens.css">
<!--
  设计依据：
  - uiux-specs/05_词汇_短语_SRS_表达库.md §1 单词学习 Session、§7 SRS 状态、§8 完课反馈
  - 学习场景沉浸原则：隐藏 TabBar，顶部仅「退出 + 进度」
  - 01 §5 语义色：颜色只辅助，四按钮以文字为主
-->
<style>
body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 12px 48px; }

/* 会话顶部栏 */
.sess-bar { display: flex; align-items: center; gap: 12px; padding: 18px 16px 8px; }
.sess-bar .exit { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-default); background: var(--surface-card); cursor: pointer; color: var(--text-secondary); font-size: 16px; }
.sess-progress { flex: 1; }
.sess-progress .bar { height: 8px; border-radius: 999px; background: var(--border-default); overflow: hidden; }
.sess-progress .bar i { display: block; height: 100%; width: 40%; background: var(--brand-primary); border-radius: 999px; transition: width .4s; }
.sess-progress .num { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; text-align: right; font-family: var(--font-en); }
.combo { font-size: 13px; font-weight: 700; color: var(--warning-main); font-family: var(--font-en); }

/* 中央词卡 */
.stage { flex: 1; display: flex; flex-direction: column; padding: 8px 16px; }
.word-card {
  flex: 1; background: var(--surface-card); border: 1px solid var(--border-default);
  border-radius: var(--r-card-lg); padding: 28px 24px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center; position: relative;
}
.srs-badge { position: absolute; top: 14px; left: 14px; }
.fav { position: absolute; top: 12px; right: 12px; width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-default); background: none; cursor: pointer; font-size: 16px; }
.word-en { font-size: 40px; font-weight: 700; letter-spacing: .01em; font-family: var(--font-en); } /* 01 §7：目标单词 30–40px */
.word-phon { font-size: 17px; color: var(--text-secondary); margin: 8px 0 16px; font-family: var(--font-en); }
.audio-btn {
  width: 52px; height: 52px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--brand-primary-soft); color: var(--brand-primary); font-size: 20px; margin-bottom: 24px;
}
.back-area { display: none; width: 100%; text-align: left; border-top: 1px dashed var(--border-strong); padding-top: 18px; margin-top: 4px; }
.back-area.show { display: block; animation: fadeup .3s ease; }
@keyframes fadeup { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.def { font-size: 17px; line-height: 1.55; margin-bottom: 12px; }
.def b { color: var(--brand-primary); }
.mini-row { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }
.mini-row b { color: var(--text-primary); font-weight: 600; }
.reveal-btn {
  width: 100%; height: 52px; border-radius: var(--r-btn-main); border: 1.5px dashed var(--border-strong);
  background: var(--surface-page); color: var(--text-secondary); font-size: 16px; cursor: pointer;
}
.reveal-btn:hover { border-color: var(--brand-primary); color: var(--brand-primary); }

/* 底部熟悉度四按钮（05 §1：颜色只辅助） */
.rate-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 14px 16px 20px; }
.rate-bar button {
  height: 52px; border-radius: var(--r-btn); border: 1px solid var(--border-strong);
  background: var(--surface-card); font-size: 15px; font-weight: 500; color: var(--text-primary); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.rate-bar button small { font-size: 10px; color: var(--text-tertiary); font-weight: 400; }
.rate-bar button:disabled { opacity: .45; cursor: not-allowed; }
.rate-bar button[data-rate="forgot"]  { border-color: var(--danger-main);  color: var(--danger-main); }
.rate-bar button[data-rate="fuzzy"]   { border-color: var(--warning-main); color: var(--warning-main); }
.rate-bar button[data-rate="recall"]  { border-color: var(--success-main); color: var(--success-main); }
.rate-bar button[data-rate="known"]   { border-color: var(--brand-primary); color: var(--brand-primary); }
.rate-bar button.picked { box-shadow: 0 0 0 2px currentColor inset; }

/* 完课反馈（05 §8） */
.done-sheet { text-align: center; }
.done-sheet .big { font-size: 32px; font-weight: 700; margin: 4px 0 2px; font-family: var(--font-en); }
.done-stats { display: flex; justify-content: center; gap: 24px; margin: 16px 0 20px; }
.done-stats div b { font-size: 20px; display: block; font-family: var(--font-en); }
.done-stats div span { font-size: 12px; color: var(--text-tertiary); }
.done-sheet .btn-primary { width: 100%; margin-bottom: 10px; height: 48px; }
.done-sheet .btn-ghost { width: 100%; height: 48px; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="title">移动端 · 词汇学习（背词会话）v0.1</span>
  <button onclick="toggleTheme()" id="themeBtn">🌙 深色</button>
</div>

<div class="device phone">
  <!-- 顶部：退出 + 进度 + 连击（沉浸原则：无 TabBar） -->
  <div class="sess-bar">
    <button class="exit" title="退出会话">✕</button>
    <div class="sess-progress">
      <div class="bar"><i id="prog"></i></div>
      <div class="num" id="progNum">12 / 30</div>
    </div>
    <span class="combo">🔥 ×3</span>
  </div>

  <div class="stage">
    <div class="word-card">
      <span class="chip brand srs-badge">学习中</span>
      <button class="fav" title="收藏到表达库">☆</button>
      <div class="word-en">resilience</div>
      <div class="word-phon">/rɪˈzɪliəns/</div>
      <button class="audio-btn" title="播放发音">🔊</button>
      <button class="reveal-btn" id="revealBtn" onclick="reveal()">先回忆，再点「显示释义」</button>

      <!-- 背面：释义/例句/搭配/词根/易混 -->
      <div class="back-area" id="backArea">
        <div class="def"><b>n.</b> 恢复力；韧性；快速恢复的能力</div>
        <div class="mini-row"><b>例句</b>　Her resilience helped her recover from failure.</div>
        <div class="mini-row"><b>搭配</b>　emotional resilience / build resilience</div>
        <div class="mini-row"><b>词根</b>　re-（回）+ sili（跳）+ -ence → 跳回来的能力</div>
        <div class="mini-row"><b>易混</b>　resistance（抵抗）· resistance 强调对抗，resilience 强调恢复</div>
      </div>
    </div>
  </div>

  <!-- 底部熟悉度（显示释义后才可点） -->
  <div class="rate-bar">
    <button data-rate="forgot" disabled onclick="rate(this,1)">忘了<small>10 分钟后重学</small></button>
    <button data-rate="fuzzy"  disabled onclick="rate(this,1)">模糊<small>明天复习</small></button>
    <button data-rate="recall" disabled onclick="rate(this,1)">记得<small>3 天后复习</small></button>
    <button data-rate="known"  disabled onclick="rate(this,1)">很熟<small>7 天后复习</small></button>
  </div>

  <!-- 完课反馈 Sheet -->
  <div class="mask" id="mask" onclick="closeDone()"></div>
  <div class="sheet done-sheet" id="doneSheet">
    <div class="grab"></div>
    <div style="font-size:40px">🎉</div>
    <div class="big">+120 XP</div>
    <p style="margin-bottom:0">本次学习完成</p>
    <div class="done-stats">
      <div><b>30</b><span>学习单词</span></div>
      <div><b>87%</b><span>正确率</span></div>
      <div><b>4</b><span>薄弱词</span></div>
    </div>
    <button class="btn-primary" onclick="closeDone()">修复 4 个薄弱词</button>
    <button class="btn-ghost" onclick="closeDone()">返回首页</button>
  </div>
</div>

<script>
let idx = 12, revealed = false;
function toggleTheme(){
  const d = document.documentElement, dark = d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeBtn').textContent = dark?'🌙 深色':'☀️ 浅色';
}
function reveal(){
  document.getElementById('backArea').classList.add('show');
  document.getElementById('revealBtn').style.display='none';
  document.querySelectorAll('.rate-bar button').forEach(b=>b.disabled=false);
  revealed = true;
}
function rate(btn){
  document.querySelectorAll('.rate-bar button').forEach(b=>b.classList.remove('picked'));
  btn.classList.add('picked');
  idx++;
  document.getElementById('prog').style.width = (idx/30*100)+'%';
  document.getElementById('progNum').textContent = idx+' / 30';
  setTimeout(()=>{
    btn.classList.remove('picked');
    if(idx>=15){ openDone(); return; }   /* 演示：提前触发完课反馈 */
    document.getElementById('backArea').classList.remove('show');
    document.getElementById('revealBtn').style.display='block';
    document.querySelectorAll('.rate-bar button').forEach(b=>b.disabled=true);
  }, 260);
}
function openDone(){ document.getElementById('doneSheet').classList.add('open'); document.getElementById('mask').classList.add('open'); }
function closeDone(){ document.getElementById('doneSheet').classList.remove('open'); document.getElementById('mask').classList.remove('open'); }
</script>
</body>
</html>
