<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>语学星 · iPad端 Adaptive Home v0.1</title>
<link rel="stylesheet" href="tokens.css">
<!--
  设计依据：
  - uiux-specs/02_信息架构：iPad 使用左侧导航或底部 Tab + 分栏内容
  - 布局（横屏 1024×768）：左列 40%（问候/主任务/快速练习）| 右列 60%（学习地图大卡/XP/待修复）
  - 底部 TabBar 与移动端一致（5 Tab）
-->
<style>
body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 24px 12px 48px; }
.cols { flex: 1; display: flex; gap: 20px; padding: 24px 24px 92px; overflow-y: auto; scrollbar-width: none; }
.cols::-webkit-scrollbar { display: none; }
.col-l { width: 40%; display: flex; flex-direction: column; gap: 16px; }
.col-r { flex: 1; display: flex; flex-direction: column; gap: 16px; }

/* 问候区 */
.greet-row { display: flex; align-items: center; gap: 12px; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #B8C2FF 0%, #7C5CFC 55%, #4C5CE6 100%); box-shadow: var(--shadow-sm); }
.greet-row h1 { font-size: 24px; font-weight: 600; flex: 1; }

/* 主任务卡 */
.hero { border-radius: var(--r-card-lg); background: var(--grad-brand); color: #fff; padding: 20px; position: relative; overflow: hidden; }
.hero::before { content: ""; position: absolute; inset: 0; opacity: .5; pointer-events: none;
  background: radial-gradient(circle at 88% 18%, rgba(255,255,255,.5) 0 1.5px, transparent 2.5px),
              radial-gradient(circle at 70% 72%, rgba(255,255,255,.4) 0 1px, transparent 2px); }
.hero .tag { font-size: 11px; letter-spacing: .06em; opacity: .85; text-transform: uppercase; font-family: var(--font-en); }
.hero h2 { font-size: 21px; font-weight: 700; margin: 6px 0 2px; }
.hero .sub { font-size: 13px; opacity: .85; margin-bottom: 12px; }
.hero .bar { height: 6px; border-radius: 999px; background: rgba(255,255,255,.25); margin-bottom: 14px; }
.hero .bar i { display: block; height: 100%; width: 76%; background: #fff; border-radius: 999px; }
.hero .btn-main { width: 100%; height: 48px; border-radius: var(--r-btn-main); border: none; background: #fff; color: var(--brand-primary-hover); font-size: 16px; font-weight: 600; cursor: pointer; }

/* 快速练习 */
.quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick button { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--r-input); cursor: pointer; font-size: 15px; color: var(--text-primary); }
.quick button:hover { border-color: var(--brand-primary); background: var(--brand-primary-soft); }
.quick b { font-family: var(--font-en); color: var(--brand-primary); }

/* 地图大卡 */
.map-card { padding: 0; overflow: hidden; flex: 1; display: flex; flex-direction: column; }
.map-view { flex: 1; min-height: 190px; position: relative; background: radial-gradient(ellipse 90% 70% at 50% 118%, #E6EBFF 0%, transparent 70%), var(--brand-primary-soft); }
html[data-theme="dark"] .map-view { background: linear-gradient(180deg,#1B2140,#171B2D); }
.node { position: absolute; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.node.done { background: var(--success-main); }
.node.current { background: var(--grad-brand); animation: breath 2.4s ease-in-out infinite; box-shadow: 0 6px 18px rgba(89,107,255,.4); }
.node.locked { background: var(--surface-card); border: 2px solid var(--border-strong); color: var(--text-tertiary); }
@keyframes breath { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
.map-area-tag { position: absolute; top: 14px; left: 16px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 5px 14px; font-size: 13px; font-weight: 600; color: var(--brand-primary-hover); }
html[data-theme="dark"] .map-area-tag { background: rgba(23,27,45,.85); color: #AAB4FF; }
.map-body { padding: 14px 18px; display: flex; align-items: center; gap: 16px; }
.map-body .grow { flex: 1; }
.map-body h3 { font-size: 16px; margin-bottom: 8px; }
.map-body .bar { height: 6px; background: var(--brand-primary-soft); border-radius: 999px; }
.map-body .bar i { display: block; height: 100%; width: 62%; background: var(--grad-brand); border-radius: 999px; }

/* XP 行 */
.xp-row { display: flex; gap: 16px; }
.xp { flex: 1; border-radius: var(--r-card); background: var(--grad-brand); color: #fff; padding: 16px; }
.xp .lv { font-size: 11px; opacity: .85; letter-spacing: .06em; font-family: var(--font-en); }
.xp b { font-size: 20px; font-weight: 700; }
.xp .bar { height: 5px; background: rgba(255,255,255,.3); border-radius: 999px; margin: 8px 0 5px; }
.xp .bar i { display: block; height: 100%; width: 45%; background: #fff; border-radius: 999px; }
.xp span { font-size: 12px; opacity: .85; font-family: var(--font-en); }
.repair { width: 42%; display: flex; flex-direction: column; justify-content: center; gap: 6px; border-left: 3px solid var(--warning-main); }
.repair b { font-size: 24px; color: var(--warning-main); font-family: var(--font-en); }
.repair span { font-size: 13px; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="toolbar">
  <span class="title">iPad 端 · Adaptive Home v0.1（1024×768 横屏）</span>
  <button onclick="toggleTheme()" id="themeBtn">🌙 深色</button>
</div>

<div class="device ipad">
  <div class="cols">
    <!-- 左列 -->
    <div class="col-l">
      <div class="greet-row">
        <div class="avatar"></div>
        <h1>晚上好，小辰</h1>
        <span class="chip streak" style="font-size:14px;padding:7px 12px">🔥 21</span>
      </div>

      <div class="hero">
        <div class="tag">Continue Learning</div>
        <h2>今日还需学习 12 分钟</h2>
        <div class="sub">CET-4 词汇计划 · Day 18 · 上次「机场英语」第 7 题</div>
        <div class="bar"><i></i></div>
        <button class="btn-main">▶　继续学习</button>
      </div>

      <div class="mod-title" style="margin:8px 0 0"><h2>快速练习</h2></div>
      <div class="quick">
        <button><b>3′</b>碎片时间</button>
        <button><b>5′</b>常用</button>
        <button><b>10′</b>深度</button>
        <button><b>＋</b>自定义</button>
      </div>

      <div class="card" style="font-size:14px;line-height:1.7;color:var(--text-secondary)">
        🎧 <b style="color:var(--text-primary)">为你推荐</b>：精听 · 机场广播（近 7 天听力正确率 58%）
        <a href="#" style="color:var(--brand-primary);text-decoration:none">　开始 →</a>
      </div>
    </div>

    <!-- 右列 -->
    <div class="col-r">
      <div class="card map-card">
        <div class="map-view">
          <span class="map-area-tag">听力港口 · 区域 3</span>
          <div class="node done" style="left:56px; top:104px">✓</div>
          <div class="node done" style="left:170px; top:52px">✓</div>
          <div class="node current" style="left:286px; top:96px">▶</div>
          <div class="node locked" style="left:400px; top:44px">🔒</div>
          <div class="node locked" style="left:508px; top:92px">🔒</div>
        </div>
        <div class="map-body">
          <div class="grow">
            <h3>学习世界 · 当前区域 62%</h3>
            <div class="bar"><i></i></div>
          </div>
          <button class="btn-primary">进入学习世界</button>
        </div>
      </div>

      <div class="xp-row">
        <div class="xp">
          <div class="lv">EXPLORER</div>
          <b>Lv.12</b>
          <div class="bar"><i></i></div>
          <span>2,450 / 3,000 XP · 今日 +86</span>
        </div>
        <div class="card repair">
          <b>7 个</b>
          <span>知识点待修复</span>
          <button class="btn-warn" style="align-self:flex-start;margin-top:4px">去修复</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部 TabBar（iPad 沿用移动端导航形态） -->
  <div class="tabbar">
    <a class="active" href="#"><svg class="ic"><path d="M3 10 L12 3 L21 10"/><path d="M5 9 V20 H19 V9"/></svg>学习</a>
    <a href="#"><svg class="ic"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/></svg>练习</a>
    <a href="#"><svg class="ic"><circle cx="12" cy="8" r="5"/><path d="M3 21 C3 16 7 14 12 14 C17 14 21 16 21 21"/></svg>世界</a>
    <a href="#"><svg class="ic"><path d="M4 5 H20 V19 H4 Z"/><path d="M4 9 H20"/></svg>课程</a>
    <a href="#"><svg class="ic"><circle cx="12" cy="8" r="4"/><path d="M4 21 C4 16 8 15 12 15 C16 15 20 16 20 21"/></svg>我的</a>
  </div>
</div>

<script>
function toggleTheme(){
  const d=document.documentElement, dark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme', dark?'light':'dark');
  document.getElementById('themeBtn').textContent = dark?'🌙 深色':'☀️ 浅色';
}
</script>
</body>
</html>
