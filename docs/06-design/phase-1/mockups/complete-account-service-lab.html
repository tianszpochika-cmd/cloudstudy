<!doctype html>
<html lang="zh-CN" data-theme="light" data-device="mobile" data-motion="on">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="语学星 Phase 1 我的与服务页面族跨端交互实验室">
  <title>语学星 · 我的与服务页面族交互实验室</title>
  <style>
    :root {
      --lab-bg: #eef1fb;
      --lab-panel: #ffffff;
      --lab-ink: #202332;
      --lab-muted: #70788d;
      --lab-border: #dfe4f1;
      --lab-accent: #596bff;
      --lab-accent-soft: #eef0ff;
      --lab-purple: #7c5cfc;
      --yx-page: #f7f8fc;
      --yx-card: #ffffff;
      --yx-elevated: #ffffff;
      --yx-ink: #202332;
      --yx-secondary: #666d80;
      --yx-tertiary: #969caf;
      --yx-border: #e6e8f0;
      --yx-border-strong: #d2d6e2;
      --yx-primary: #596bff;
      --yx-primary-hover: #4c5ce6;
      --yx-primary-soft: #eef0ff;
      --yx-success: #25b88a;
      --yx-success-soft: #eaf8f3;
      --yx-warning: #f2a83b;
      --yx-warning-soft: #fef6e8;
      --yx-danger: #e95668;
      --yx-danger-soft: #fff0f2;
      --yx-info: #3b8dff;
      --yx-shadow-sm: 0 2px 8px rgba(31,35,48,.06);
      --yx-shadow-md: 0 8px 24px rgba(31,35,48,.10);
      --device-frame: #121626;
      --device-shadow: 0 28px 72px rgba(32,44,92,.24);
      --font-cn: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
      --font-en: Inter, "SF Pro Text", Roboto, system-ui, sans-serif;
    }

    html[data-theme="dark"] {
      --lab-bg: #080c1c;
      --lab-panel: #121a37;
      --lab-ink: #f4f6ff;
      --lab-muted: #a8b2d8;
      --lab-border: #2b3866;
      --lab-accent: #7785ff;
      --lab-accent-soft: rgba(119,133,255,.16);
      --lab-purple: #9a84ff;
      --yx-page: #0f1220;
      --yx-card: #171b2d;
      --yx-elevated: #20253a;
      --yx-ink: #f4f6fb;
      --yx-secondary: #b5bacc;
      --yx-tertiary: #81889d;
      --yx-border: #2b3148;
      --yx-border-strong: #3a4160;
      --yx-primary: #7785ff;
      --yx-primary-hover: #8c98ff;
      --yx-primary-soft: #232a4d;
      --yx-success: #43c99b;
      --yx-success-soft: #12332a;
      --yx-warning: #f6b84f;
      --yx-warning-soft: #332812;
      --yx-danger: #ff6d7e;
      --yx-danger-soft: #3a1f26;
      --yx-info: #6eadff;
      --yx-shadow-sm: 0 2px 8px rgba(0,0,0,.18);
      --yx-shadow-md: 0 8px 24px rgba(0,0,0,.24);
      --device-frame: #050914;
      --device-shadow: 0 28px 72px rgba(39,54,149,.32);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 26px;
      color: var(--lab-ink);
      background: var(--lab-bg);
      font-family: var(--font-cn);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 3px solid rgba(59,141,255,.38);
      outline-offset: 2px;
    }
    [hidden] { display: none !important; }

    .lab { max-width: 1540px; margin: 0 auto; }
    .lab-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }
    .brand-lockup { display: flex; align-items: flex-start; gap: 12px; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 auto;
      border-radius: 13px;
      color: #fff;
      background: linear-gradient(135deg, #596bff, #7c5cfc);
      font-size: 20px;
      box-shadow: 0 8px 18px rgba(89,107,255,.24);
    }
    .lab-header h1 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .lab-header p { margin: 5px 0 0; color: var(--lab-muted); font-size: 13px; line-height: 1.5; }
    .lab-controls { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .lab-control {
      min-height: 36px;
      padding: 7px 12px;
      border: 1px solid var(--lab-border);
      border-radius: 999px;
      color: var(--lab-ink);
      background: var(--lab-panel);
      font-size: 12px;
      transition: border-color .18s, background .18s, color .18s;
    }
    .lab-control:hover, .lab-control.active { border-color: var(--lab-accent); color: var(--lab-accent); background: var(--lab-accent-soft); }

    .lab-layout { display: grid; grid-template-columns: 264px minmax(0, 1fr); gap: 16px; align-items: start; }
    .lab-rail, .preview-panel {
      border: 1px solid var(--lab-border);
      border-radius: 20px;
      background: var(--lab-panel);
    }
    .lab-rail { position: sticky; top: 16px; padding: 15px; }
    .rail-intro { padding: 4px 5px 14px; }
    .rail-intro h2 { margin: 0 0 5px; font-size: 16px; }
    .rail-intro p { margin: 0; color: var(--lab-muted); font-size: 12px; line-height: 1.55; }
    .rail-note {
      margin: 0 0 15px;
      padding: 10px 11px;
      border: 1px solid rgba(89,107,255,.18);
      border-radius: 13px;
      color: var(--lab-muted);
      background: var(--lab-accent-soft);
      font-size: 11px;
      line-height: 1.55;
    }
    .rail-note strong { color: var(--lab-ink); }
    .rail-label { margin: 16px 6px 6px; color: var(--lab-muted); font-size: 10px; font-weight: 700; letter-spacing: .1em; }
    .rail-nav { display: grid; gap: 4px; }
    .rail-nav button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-height: 39px;
      padding: 8px 10px;
      border: 0;
      border-radius: 11px;
      color: var(--lab-muted);
      background: transparent;
      text-align: left;
      font-size: 12px;
      transition: background .18s, color .18s;
    }
    .rail-nav button:hover { color: var(--lab-ink); background: var(--lab-bg); }
    .rail-nav button.active { color: var(--lab-accent); background: var(--lab-accent-soft); font-weight: 700; }
    .rail-icon { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--lab-bg); font-size: 12px; }
    .rail-nav button.active .rail-icon { color: #fff; background: var(--lab-accent); }
    .rail-footer { margin-top: 16px; padding: 11px 6px 2px; color: var(--lab-muted); font-size: 11px; line-height: 1.6; }

    .preview-panel { min-width: 0; padding: 15px; }
    .preview-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 13px; }
    .preview-title strong { display: block; font-size: 14px; }
    .preview-title span { display: block; margin-top: 3px; color: var(--lab-muted); font-size: 11px; }
    .device-switch { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .device-switch button { min-height: 32px; padding: 6px 10px; border: 1px solid var(--lab-border); border-radius: 999px; color: var(--lab-ink); background: var(--lab-panel); font-size: 12px; }
    .device-switch button:hover, .device-switch button.active { border-color: var(--lab-accent); color: var(--lab-accent); background: var(--lab-accent-soft); }
    .stage {
      display: grid;
      place-items: center;
      min-height: 820px;
      overflow: auto;
      padding: 25px;
      border-radius: 15px;
      background:
        radial-gradient(circle at 12% 15%, rgba(89,107,255,.16), transparent 25%),
        radial-gradient(circle at 88% 82%, rgba(124,92,252,.13), transparent 30%),
        #f3f5fc;
    }
    html[data-theme="dark"] .stage { background: #0a0d18; }

    .device {
      position: relative;
      flex: 0 0 auto;
      color: var(--yx-ink);
      background: var(--yx-page);
      isolation: isolate;
      box-shadow: var(--device-shadow);
      transition: width .28s, height .28s, border-radius .28s;
    }
    .device-screen { position: relative; height: 100%; overflow: hidden; background: var(--yx-page); }
    .device.mobile { width: 390px; height: 844px; padding: 11px; border: 1px solid #2c3042; border-radius: 50px; background: linear-gradient(145deg,#32374b 0%,#131727 24%,#090b13 62%,#2b3042 100%); box-shadow: 0 0 0 1px rgba(255,255,255,.07), inset 0 0 0 1px rgba(0,0,0,.65), var(--device-shadow); }
    .device.mobile::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(255,255,255,.08); border-radius: 47px; pointer-events: none; }
    .device.mobile .device-screen { z-index: 1; border-radius: 39px; clip-path: inset(0 round 39px); }
    .device.pad { width: 1024px; height: 720px; padding: 11px; border: 2px solid #2b3044; border-radius: 31px; background: var(--device-frame); }
    .device.pad .device-screen { border-radius: 20px; }
    .device.web { width: min(1280px, 100%); height: 760px; border: 1px solid var(--yx-border-strong); border-radius: 18px; background: var(--yx-page); }
    .device.web .device-screen { border-radius: 17px; }
    .hardware-island, .home-indicator { display: none; }
    .device.mobile .hardware-island { display: block; position: absolute; z-index: 5; top: 14px; left: 50%; width: 124px; height: 36px; transform: translateX(-50%); border-radius: 999px; background: #05060a; box-shadow: inset 0 1px 2px rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.35); }
    .device.mobile .home-indicator { display: block; position: absolute; z-index: 6; bottom: 14px; left: 50%; width: 118px; height: 4px; transform: translateX(-50%); border-radius: 999px; background: rgba(255,255,255,.76); }

    .screen-shell { display: flex; width: 100%; height: 100%; min-width: 0; }
    .screen-sidebar { display: none; flex: 0 0 184px; flex-direction: column; padding: 22px 12px; border-right: 1px solid var(--yx-border); background: color-mix(in srgb, var(--yx-card) 80%, transparent); }
    .pad .screen-sidebar, .web .screen-sidebar { display: flex; }
    .screen-brand { display: flex; align-items: center; gap: 8px; margin: 0 7px 24px; color: var(--yx-ink); font-weight: 700; font-size: 14px; }
    .screen-brand-mark { display: grid; place-items: center; width: 25px; height: 25px; border-radius: 8px; color: #fff; background: linear-gradient(135deg,#596bff,#7c5cfc); font-size: 13px; }
    .screen-nav-label { margin: 14px 8px 6px; color: var(--yx-tertiary); font-size: 9px; font-weight: 700; letter-spacing: .1em; }
    .screen-nav { display: grid; gap: 3px; }
    .screen-nav button { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 36px; padding: 7px 9px; border: 0; border-radius: 10px; color: var(--yx-secondary); background: transparent; text-align: left; font-size: 11px; }
    .screen-nav button:hover { color: var(--yx-ink); background: var(--yx-page); }
    .screen-nav button.active { color: var(--yx-primary); background: var(--yx-primary-soft); font-weight: 700; }
    .screen-nav-icon { width: 18px; text-align: center; font-size: 13px; }
    .screen-sidebar-foot { margin-top: auto; padding: 12px 8px 0; color: var(--yx-tertiary); font-size: 10px; line-height: 1.55; }
    .screen-main { position: relative; display: flex; flex: 1; min-width: 0; flex-direction: column; overflow: hidden; background: var(--yx-page); }
    .screen-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 58px; padding: 14px 18px 8px; border-bottom: 1px solid var(--yx-border); background: var(--yx-page); }
    .screen-header h1 { margin: 0; font-size: 16px; letter-spacing: -.02em; }
    .screen-header p { margin: 3px 0 0; color: var(--yx-secondary); font-size: 11px; }
    .screen-header-actions { display: flex; align-items: center; gap: 5px; }
    .icon-btn { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid transparent; border-radius: 12px; color: var(--yx-secondary); background: transparent; font-size: 16px; }
    .icon-btn:hover { border-color: var(--yx-border); color: var(--yx-primary); background: var(--yx-card); }
    .screen-scroll { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 18px; scrollbar-color: var(--yx-border-strong) transparent; }
    .screen-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
    .screen-scroll::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--yx-border-strong); }
    .mobile .screen-header { min-height: 62px; padding: 27px 16px 9px; border-bottom: 0; }
    .mobile .screen-header h1 { font-size: 18px; }
    .mobile .screen-scroll { padding: 10px 16px 86px; }
    .mobile .screen-sidebar { display: none; }
    .mobile-tabs { display: none; }
    .mobile .mobile-tabs { position: absolute; z-index: 3; right: 0; bottom: 0; left: 0; display: flex; height: 74px; padding: 8px 7px 18px; border-top: 1px solid var(--yx-border); background: color-mix(in srgb, var(--yx-card) 94%, transparent); backdrop-filter: blur(16px); }
    .mobile-tabs button { flex: 1; min-width: 44px; border: 0; color: var(--yx-tertiary); background: transparent; font-size: 10px; }
    .mobile-tabs button span { display: block; height: 20px; margin-bottom: 3px; font-size: 16px; }
    .mobile-tabs button.active { color: var(--yx-primary); font-weight: 700; }

    .sync-strip { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 32px; margin-bottom: 14px; padding: 7px 10px; border: 1px solid var(--yx-border); border-radius: 10px; color: var(--yx-secondary); background: var(--yx-card); font-size: 10px; }
    .sync-strip button { border: 0; color: var(--yx-primary); background: transparent; font-size: 10px; font-weight: 600; }
    .sync-dot { display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: var(--yx-success); }
    .sync-strip.syncing .sync-dot { background: var(--yx-info); box-shadow: 0 0 0 4px rgba(59,141,255,.12); }
    .sync-strip.offline .sync-dot { background: var(--yx-warning); }
    .sync-strip.conflict .sync-dot { background: var(--yx-danger); }
    .eyebrow { color: var(--yx-primary); font-family: var(--font-en); font-size: 10px; font-weight: 700; letter-spacing: .1em; }
    .page-intro { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin: 2px 0 16px; }
    .page-intro h2 { margin: 3px 0 5px; font-size: 22px; letter-spacing: -.04em; }
    .page-intro p { max-width: 560px; margin: 0; color: var(--yx-secondary); font-size: 12px; line-height: 1.55; }
    .page-intro .status-pill { margin-top: 2px; }
    .card { margin-top: 12px; padding: 15px; border: 1px solid var(--yx-border); border-radius: 16px; background: var(--yx-card); box-shadow: var(--yx-shadow-sm); }
    .card:first-child { margin-top: 0; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .card-head h3 { margin: 0; font-size: 14px; }
    .card-head span { color: var(--yx-tertiary); font-size: 10px; }
    .muted { color: var(--yx-secondary); }
    .caption { color: var(--yx-tertiary); font-size: 11px; line-height: 1.55; }
    .status-pill, .chip { display: inline-flex; align-items: center; gap: 4px; min-height: 25px; padding: 4px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; white-space: nowrap; }
    .status-pill.success, .chip.success { color: var(--yx-success); background: var(--yx-success-soft); }
    .status-pill.warning, .chip.warning { color: var(--yx-warning); background: var(--yx-warning-soft); }
    .status-pill.danger, .chip.danger { color: var(--yx-danger); background: var(--yx-danger-soft); }
    .status-pill.info, .chip.info { color: var(--yx-info); background: color-mix(in srgb, var(--yx-info) 14%, transparent); }
    .status-pill.neutral, .chip.neutral { color: var(--yx-secondary); background: var(--yx-page); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 0 14px; border: 1px solid transparent; border-radius: 12px; font-size: 12px; font-weight: 600; transition: background .18s, border-color .18s, color .18s, transform .18s; }
    .btn:active { transform: translateY(1px); }
    .btn.primary { color: #fff; background: linear-gradient(135deg, var(--yx-primary), #7c5cfc); box-shadow: 0 7px 16px rgba(89,107,255,.22); }
    .btn.primary:hover { background: var(--yx-primary-hover); }
    .btn.secondary { border-color: var(--yx-border-strong); color: var(--yx-ink); background: var(--yx-card); }
    .btn.secondary:hover { border-color: var(--yx-primary); color: var(--yx-primary); }
    .btn.tertiary { min-height: 36px; padding: 0 10px; color: var(--yx-primary); background: var(--yx-primary-soft); }
    .btn.danger { color: var(--yx-danger); background: transparent; }
    .btn.danger:hover { background: var(--yx-danger-soft); }
    .text-btn { padding: 6px 0; border: 0; color: var(--yx-primary); background: transparent; font-size: 11px; font-weight: 600; }
    .link-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--yx-primary); font-size: 11px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .actions.right { justify-content: flex-end; }

    .profile-hero { position: relative; overflow: hidden; padding: 18px; border-radius: 20px; color: #fff; background: linear-gradient(135deg,#596bff 0%,#7c5cfc 62%,#a16dff 100%); box-shadow: 0 12px 28px rgba(89,107,255,.24); }
    .profile-hero::after { content: ""; position: absolute; top: -58px; right: -35px; width: 190px; height: 190px; border: 24px solid rgba(255,255,255,.12); border-radius: 50%; }
    .profile-top { position: relative; z-index: 1; display: flex; align-items: center; gap: 13px; }
    .avatar { position: relative; display: grid; place-items: center; width: 58px; height: 58px; flex: 0 0 auto; overflow: hidden; border: 3px solid rgba(255,255,255,.7); border-radius: 20px; background: linear-gradient(145deg,#d8ddff,#7f8eff); }
    .avatar::before { content: ""; position: absolute; top: 11px; width: 26px; height: 27px; border-radius: 50% 50% 42% 42%; background: #f6d2bb; box-shadow: 0 -6px 0 2px #3d426c; }
    .avatar::after { content: ""; position: absolute; bottom: -8px; width: 45px; height: 29px; border-radius: 50% 50% 0 0; background: #596bff; }
    .profile-name { font-size: 16px; font-weight: 700; }
    .profile-id { margin-top: 3px; opacity: .78; font-family: var(--font-en); font-size: 10px; }
    .profile-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .hero-chip { padding: 4px 8px; border-radius: 999px; color: #fff; background: rgba(255,255,255,.18); font-size: 10px; }
    .profile-actions { position: relative; z-index: 1; display: flex; gap: 7px; margin-top: 15px; }
    .profile-actions button { min-height: 36px; padding: 0 10px; border: 1px solid rgba(255,255,255,.3); border-radius: 10px; color: #fff; background: rgba(255,255,255,.12); font-size: 11px; }
    .profile-actions button:hover { background: rgba(255,255,255,.22); }
    .profile-actions .notification { position: relative; }
    .badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border: 2px solid var(--yx-primary); border-radius: 999px; color: #fff; background: var(--yx-danger); font-size: 8px; line-height: 12px; }

    .stat-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; margin-top: 12px; }
    .stat { min-width: 0; padding: 12px 10px; border: 1px solid var(--yx-border); border-radius: 13px; background: var(--yx-card); }
    .stat strong { display: block; color: var(--yx-ink); font-family: var(--font-en); font-size: 18px; font-variant-numeric: tabular-nums; }
    .stat span { display: block; margin-top: 3px; color: var(--yx-tertiary); font-size: 10px; }
    .stat small { display: block; margin-top: 5px; color: var(--yx-success); font-size: 9px; }
    .resume-card { display: flex; align-items: center; gap: 12px; }
    .progress-ring { display: grid; place-items: center; width: 54px; height: 54px; flex: 0 0 auto; border-radius: 50%; background: conic-gradient(var(--yx-primary) 74%, var(--yx-primary-soft) 0); }
    .progress-ring::after { content: ""; position: absolute; width: 44px; height: 44px; border-radius: 50%; background: var(--yx-card); }
    .progress-ring span { position: relative; z-index: 1; color: var(--yx-primary); font-family: var(--font-en); font-size: 11px; font-weight: 700; }
    .resume-copy { min-width: 0; flex: 1; }
    .resume-copy strong { display: block; font-size: 13px; }
    .resume-copy span { display: block; margin-top: 4px; color: var(--yx-secondary); font-size: 11px; line-height: 1.45; }
    .quick-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    .quick-card { display: flex; align-items: center; gap: 9px; min-height: 52px; padding: 9px; border: 1px solid var(--yx-border); border-radius: 12px; color: var(--yx-ink); background: var(--yx-card); text-align: left; }
    .quick-card:hover { border-color: var(--yx-primary); background: var(--yx-primary-soft); }
    .quick-card i { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9px; color: var(--yx-primary); background: var(--yx-primary-soft); font-style: normal; }
    .quick-card strong { display: block; font-size: 11px; }
    .quick-card span { display: block; margin-top: 2px; color: var(--yx-tertiary); font-size: 9px; }

    .two-col { display: grid; grid-template-columns: minmax(0,1.12fr) minmax(0,.88fr); gap: 12px; }
    .three-col { display: grid; grid-template-columns: repeat(3,minmax(0,1fr)); gap: 10px; }
    .metric-box { padding: 12px; border: 1px solid var(--yx-border); border-radius: 13px; background: var(--yx-page); }
    .metric-box strong { display: block; font-family: var(--font-en); font-size: 21px; }
    .metric-box span { display: block; margin-top: 3px; color: var(--yx-secondary); font-size: 10px; }

    function renderPage() {
      const pages = { home: homePage, report: reportPage, messages: messagesPage, commerce: commercePage, orders: ordersPage, refund: refundPage, settings: settingsPage, appearance: appearancePage, audio: audioPage, devices: devicesPage, privacy: privacyPage, support: supportPage, ticket: ticketPage, sync: syncPage };
      return pages[state.page] ? pages[state.page]() : homePage();
    }

    function render() {
      root.dataset.theme = state.theme;
      root.dataset.device = state.device;
      root.dataset.motion = state.motion;
      deviceEl.className = `device ${state.device}`;
      screenEl.innerHTML = shell(renderPage());
      document.querySelectorAll('.lab-rail [data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === state.page));
      document.querySelectorAll('.device-switch [data-device]').forEach(button => button.classList.toggle('active', button.dataset.device === state.device));
      document.getElementById('previewTitle').textContent = pageMeta[state.page][0];
      document.getElementById('previewHint').textContent = pageMeta[state.page][1];
      document.getElementById('themeBtn').textContent = `主题：${state.theme === 'dark' ? '深色' : '浅色'}`;
      document.getElementById('themeBtn').classList.toggle('active', state.theme === 'dark');
      document.getElementById('motionBtn').textContent = `动效：${state.motion === 'off' ? '减弱' : '开启'}`;
      document.getElementById('motionBtn').classList.toggle('active', state.motion === 'off');
      screenEl.querySelector('.screen-scroll')?.scrollTo({ top: 0, behavior: 'auto' });
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add('show');
      clearTimeout(window.__yxToastTimer);
      window.__yxToastTimer = setTimeout(() => toastEl.classList.remove('show'), 2400);
    }

    function openModal(title, body, actions) {
      modalTitle.textContent = title;
      modalBody.innerHTML = body;
      modalActions.innerHTML = actions;
      modalBackdrop.classList.add('open');
      modalBackdrop.dataset.open = 'true';
      modalActions.querySelector('button')?.focus();
    }

    function closeModal() {
      modalBackdrop.classList.remove('open');
      modalBackdrop.dataset.open = 'false';
    }

    function confirmDanger(action, title, body, confirmLabel) {
      openModal(title, `<p>${body}</p>`, `<button class="btn secondary" type="button" data-action="modal-cancel">取消</button><button class="btn danger" type="button" data-action="${action}">${confirmLabel}</button>`);
    }

    function goPage(page, announce = true) {
      if (!pageMeta[page]) return;
      state.page = page;
      render();
      if (announce) showToast(`已进入“${pageMeta[page][0]}”`);
    }

    function handleAction(target) {
      const action = target.dataset.action;
      if (!action) return;
      if (action === 'primary-route') { showToast(`${target.dataset.primary}页面在学习端主导航中打开`); return; }
      if (action === 'modal-cancel') { closeModal(); return; }
      if (action === 'profile-edit') { openModal('编辑个人资料', '<div class="field"><label for="profileName">昵称</label><input id="profileName" value="小辰"></div><div class="field"><label for="profileGoal">每日学习目标</label><select id="profileGoal"><option>15 分钟</option><option selected>30 分钟</option><option>45 分钟</option><option>60 分钟</option></select></div><p class="caption">头像与昵称会同步到本人资料；Household 成员只看到你选择的公开展示名。</p>', '<button class="btn secondary" type="button" data-action="modal-cancel">取消</button><button class="btn primary" type="button" data-action="save-profile">保存资料</button>'); return; }
      if (action === 'save-profile') { closeModal(); showToast('个人资料已保存并同步到其他设备'); return; }
      if (action === 'resume') { showToast(state.sync === 'offline' ? '当前离线，已从本机恢复到第 7 题' : '已恢复到机场英语第 7 题'); return; }
      if (action === 'report-range') { state.reportRange = target.dataset.range; render(); showToast(`已切换到${state.reportRange}报告`); return; }
      if (action === 'report-next') { showToast('已加入今日练习队列：7 个修复点，预计 14 分钟'); return; }
      if (action === 'message-filter') { state.messageFilter = target.dataset.filter; render(); return; }
      if (action === 'mark-read') { state.allRead = true; state.readMessages = new Set(messages.map(item => item.id)); render(); showToast('所有消息已标记为已读'); return; }
      if (action === 'read-message') { state.readMessages.add(target.dataset.messageId); render(); showToast('消息已读，正在打开关联页面'); setTimeout(() => goPage(target.dataset.messagePage, false), 120); return; }
      if (action === 'select-plan') { state.selectedPlan = target.dataset.plan; render(); showToast('已选择套餐，可继续查看总价与权益'); return; }
      if (action === 'checkout') { const price = state.selectedPlan === 'month' ? '¥28' : state.selectedPlan === 'quarter' ? '¥68' : '¥198'; openModal('确认创建订单', `<p>你选择了 <strong>${state.selectedPlan === 'month' ? 'Pro 月卡' : state.selectedPlan === 'quarter' ? 'Pro 季卡' : 'Pro 年度畅学卡'}</strong>，总价 <strong>${price}</strong>。</p><p>下一步会创建待支付订单，必须由微信、支付宝或 iOS 渠道完成验证后才会开通权益。</p>`, '<button class="btn secondary" type="button" data-action="modal-cancel">返回</button><button class="btn primary" type="button" data-action="confirm-checkout">创建待支付订单</button>'); return; }
      if (action === 'confirm-checkout') { closeModal(); state.orderCreated = true; goPage('orders', false); showToast('订单已创建为“待支付”，未支付不会提前开通权益'); return; }
      if (action === 'show-rights') { openModal('Pro 与 Free 权益对比', '<div class="rights-list"><div class="right-item"><strong>FREE</strong><span>每日 20 个新词、基础语法、普通自习室、标准模考 1 套。</span></div><div class="right-item"><strong>PRO</strong><span>无限背词与复习、完整题库、长难句 X 光机、高级报告、离线包和更多主题。</span></div></div><p>基础学习闭环不会被全部锁死，会员用于扩展学习深度和服务。</p>', '<button class="btn primary" type="button" data-action="modal-cancel">知道了</button>'); return; }

      if (action === 'confirm-clear-recordings') { closeModal(); showToast('本地录音已清除'); return; }

      if (action === 'confirm-reset-progress') { closeModal(); state.sync = 'syncing'; render(); showToast('重置请求已受理，正在同步影响范围'); return; }
      if (action === 'delete-account') { confirmDanger('confirm-delete-account', '申请注销账号？', '注销需要二次认证，并进入 7 天冷静期。冷静期结束后会撤销设备、退出房间、删除/匿名化个人资料；法律、订单和安全审计只保留匿名记录。', '进入 7 天冷静期'); return; }

      if (action === 'logout') { openModal('退出登录', '<p>退出当前设备会撤销本设备会话，但不会删除学习数据或会员权益。</p>', '<button class="btn secondary" type="button" data-action="modal-cancel">取消</button><button class="btn primary" type="button" data-action="confirm-logout">退出登录</button>'); return; }
      if (action === 'confirm-logout') { closeModal(); showToast('原型已模拟退出登录，真实端返回登录页'); return; }

      const pageButton = event.target.closest('[data-page]');
      if (pageButton) { goPage(pageButton.dataset.page); return; }
      const deviceButton = event.target.closest('.device-switch [data-device]');
      if (deviceButton) { state.device = deviceButton.dataset.device; render(); showToast(`${state.device === 'mobile' ? 'Mobile' : state.device === 'pad' ? 'Pad' : 'Web'} 预览`); return; }
      const actionTarget = event.target.closest('[data-action]');
      if (actionTarget) handleAction(actionTarget);
    });

    document.addEventListener('input', event => {
      const search = event.target.closest('[data-faq-search]');
      if (!search) return;
      state.faqQuery = search.value;
      const query = search.value.toLowerCase();
      screenEl.querySelectorAll('[data-faq-item]').forEach(item => { item.hidden = query && !item.dataset.faqText.toLowerCase().includes(query); });
    });

    document.getElementById('themeBtn').addEventListener('click', () => { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); showToast(state.theme === 'dark' ? '已切换到深色星海' : '已切换到浅色极光'); });
    document.getElementById('motionBtn').addEventListener('click', () => { state.motion = state.motion === 'off' ? 'on' : 'off'; render(); showToast(state.motion === 'off' ? '已减弱动效，保留状态变化' : '已恢复动效'); });
    document.getElementById('resetBtn').addEventListener('click', () => {
      state.page = 'home'; state.device = 'mobile'; state.theme = 'light'; state.motion = 'on'; state.sync = 'synced'; state.reportRange = '本周'; state.messageFilter = '全部'; state.allRead = false; state.readMessages = new Set(); state.selectedPlan = 'year'; state.householdMembers = 2; state.invitePending = false; state.orderCreated = false; state.refundOrder = 'YX202608180031'; state.exportState = 'idle'; state.deletionPending = false; state.ticketSubmitted = false; state.faqQuery = ''; state.downloadTab = '课程'; state.downloadPaused = false; state.kickedDevices = new Set(); state.voice = '美音'; state.speed = '1.0×'; state.quality = 'High'; Object.keys(state.toggles).forEach(key => { state.toggles[key] = ['dailyTask','review','streak','reactions','membership','courses','push','email','autoplay','sound','haptics'].includes(key); }); closeModal(); render(); showToast('页面族预览已重置');
    });

    modalBackdrop.addEventListener('click', event => { if (event.target === modalBackdrop) closeModal(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    render();
  </script>
