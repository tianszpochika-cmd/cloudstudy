spring:
  config:
    activate:
      on-profile: local

iam:
  # Explicit local-only opt-out; production/default configuration remains Secure.
  jwt:
    ephemeral-keys-allowed: true
    refresh-cookie-secure: false
  auth:
    # Explicit local-only opt-in; the base default stays deny until real device proof exists.
    # The placeholder keeps an environment override effective in this profile.
    native-transport-policy: ${IAM_NATIVE_TRANSPORT_POLICY:local-unverified}
  idempotency:
    replay-secret: local-only-idempotency-replay-secret-2026
    fingerprint-secret: local-only-idempotency-fingerprint-secret-2026
    # V13 cutover requires an explicit IAM_IDEMPOTENCY_V13_WRITERS_DRAINED confirmation.
  media:
    # P1-LIVE-012 (decision A), local-only: consented learners carry the fixture
    # license so seeded media assets authorize via content rights.
    learner-content-rights: LOCAL_FIXTURE
