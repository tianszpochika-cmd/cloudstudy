spring:
  application:
    name: iam-service
  lifecycle:
    timeout-per-shutdown-phase: ${IAM_SHUTDOWN_TIMEOUT:20s}
  flyway:
    enabled: ${IAM_FLYWAY_ENABLED:${IAM_PERSISTENCE_ENABLED:false}}

server:
  # The IAM process is a local development boundary until deployment identity is approved.
  address: ${IAM_SERVER_ADDRESS:127.0.0.1}
  # 18087 is the fixed local port registered in config/local-ports.json.
  port: ${IAM_SERVICE_PORT:18087}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${OTEL_ENABLED:true}
    map-environment-variables: true
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}}

logging:
  include-application-name: false
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

iam:
  phase: phase-1
  platform-tenant: platform
  local-adult-gate-enabled: ${IAM_LOCAL_ADULT_GATE_ENABLED:false}
  consent:
    # auto: local/test profiles use explicit candidate documents; other profiles read the
    # published iam_consent_document_version control plane and fail closed without it.
    # control-plane: force the published control plane (requires durable persistence).
    # local-candidate: explicit local/test-only candidate documents.
    policy-source: ${IAM_CONSENT_POLICY_SOURCE:auto}
  auth:
    # deny: NATIVE_SECURE_STORAGE is refused until a server-verifiable device proof
    # (App Attest/Play Integrity) is provisioned; local-unverified is allowed only in an
    # explicit local/test profile and never claims production trust.
    native-transport-policy: ${IAM_NATIVE_TRANSPORT_POLICY:deny}
  jwt:
    issuer: ${IAM_JWT_ISSUER:http://127.0.0.1:18087}
    audience: ${IAM_JWT_AUDIENCE:yuxuexing-api}
    algorithm: ${IAM_JWT_ALGORITHM:RS256}
    key-id: ${IAM_JWT_KEY_ID:iam-local-2026-08}
    private-key-pem: ${IAM_JWT_PRIVATE_KEY_PEM:}
    private-key-file: ${IAM_JWT_PRIVATE_KEY_FILE:}
    # Public JWK JSON for the previous signer during a controlled overlap window.
    previous-public-keys-json: ${IAM_JWT_PREVIOUS_PUBLIC_KEYS_JSON:}
    # Local-only default. Production must set false and mount a KMS/secret-manager key.
    ephemeral-keys-allowed: ${IAM_JWT_EPHEMERAL_KEYS_ALLOWED:false}
    access-token-ttl: ${IAM_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${IAM_REFRESH_TOKEN_TTL:30d}
    clock-skew: ${IAM_JWT_CLOCK_SKEW:60s}
    refresh-cookie-name: ${IAM_REFRESH_COOKIE_NAME:yuxuexing_refresh}
    # Secure is fail-closed. Only application-local.yaml/application-test.yaml may explicitly
    # disable it; an environment variable must not silently downgrade production cookies.
    refresh-cookie-secure: true
  account:
    password-min-length: ${IAM_PASSWORD_MIN_LENGTH:12}
    max-failed-attempts: ${IAM_MAX_FAILED_ATTEMPTS:5}
    lock-duration: ${IAM_ACCOUNT_LOCK_DURATION:15m}
    reset-token-ttl: ${IAM_RESET_TOKEN_TTL:15m}
    login-requests-per-minute: ${IAM_LOGIN_RATE_LIMIT:20}
    reset-requests-per-minute: ${IAM_RESET_RATE_LIMIT:5}
  persistence:
    enabled: ${IAM_PERSISTENCE_ENABLED:false}
    jdbc-url: ${IAM_JDBC_URL:jdbc:mysql://127.0.0.1:13306/iam_service?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${IAM_JDBC_USERNAME:}
    password: ${IAM_JDBC_PASSWORD:}
    schema: iam_service
  idempotency:
    # Required when persistence is enabled; never use a committed/default production secret.
    replay-secret: ${IAM_IDEMPOTENCY_REPLAY_SECRET:}
    # Independent HMAC key for request bindings; required in every non-local/test deployment.
    fingerprint-secret: ${IAM_IDEMPOTENCY_FINGERPRINT_SECRET:}
    # One-way V13 cutover acknowledgment. Set true only after old IAM writers and in-flight
    # requests are stopped; once V13 is recorded successful normal restarts do not require it.
    v13-writers-drained: ${IAM_IDEMPOTENCY_V13_WRITERS_DRAINED:false}
    retention: ${IAM_IDEMPOTENCY_RETENTION:24h}
  policy:
    bootstrap:
      # Deliberately disabled unless an explicit local/test operator bootstrap is requested.
      enabled: ${IAM_POLICY_BOOTSTRAP_ENABLED:false}
      existing-account-identifier: ${IAM_POLICY_BOOTSTRAP_EXISTING_ACCOUNT_IDENTIFIER:}
