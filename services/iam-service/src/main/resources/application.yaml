spring:
  application:
    name: iam-service
  lifecycle:
    timeout-per-shutdown-phase: ${IAM_SHUTDOWN_TIMEOUT:20s}
  flyway:
    enabled: ${IAM_FLYWAY_ENABLED:false}

server:
  # The IAM process is a local development boundary until deployment identity is approved.
  address: ${IAM_SERVER_ADDRESS:127.0.0.1}
  # 18087 is the fixed local port registered in config/local-ports.json.
  port: ${IAM_SERVICE_PORT:18087}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${OTEL_ENABLED:true}
    map-environment-variables: true
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}}

logging:
  include-application-name: false
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

iam:
  phase: phase-1
  platform-tenant: platform
  provider-mode: ${IAM_PROVIDER_MODE:standard-oidc}
  # The external provider must be explicitly enabled. With the default off, all login and
  # principal creation paths fail closed; IAM never becomes a token server.
  real-provider-enabled: ${IAM_REAL_PROVIDER_ENABLED:false}
  # Only the disposable local Keycloak test profile may enable this. Production uses verified
  # IdP age evidence or a separately authenticated age service.
  local-adult-gate-enabled: false
  oidc:
    enabled: false
    provider-id: standard-oidc
    discovery-uri: http://127.0.0.1:18099/realms/yuxuexing-local/.well-known/openid-configuration
    expected-issuer:
    client-id: yuxuexing-learner-web
    learner-client-id: yuxuexing-learner-web
    admin-client-id: yuxuexing-admin-web
    mobile-h5-client-id: yuxuexing-mobile-h5
    mobile-app-client-id: yuxuexing-mobile-app
    client-authentication-method: none
    audience: yuxuexing-api
    redirect-uris:
      - http://127.0.0.1:18180/auth/callback
    scopes:
      - openid
      - profile
      - email
    age-claim: age
    request-timeout: 5s
    discovery-cache-ttl: 5m
    jwks-max-age: 15m
    transaction-ttl: 5m
  persistence:
    enabled: false
    jdbc-url: jdbc:mysql://127.0.0.1:13306/yuxuexing?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
    username: yuxuexing
    password: yuxuexing
    schema: iam_service
