spring:
  application:
    name: ${service.name}
  lifecycle:
    timeout-per-shutdown-phase: ${CONTENT_SERVICE_SHUTDOWN_TIMEOUT:20s}
  flyway:
    enabled: ${CONTENT_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    schemas: ${CONTENT_SERVICE_SCHEMA:content_service}
    default-schema: ${CONTENT_SERVICE_SCHEMA:content_service}

server:
  address: ${CONTENT_SERVICE_SERVER_ADDRESS:127.0.0.1}
  # 18089 is the fixed port registered by the repository port authority.
  port: ${CONTENT_SERVICE_PORT:18089}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${OTEL_ENABLED:true}
    map-environment-variables: true
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}}

logging:
  include-application-name: false
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

service:
  name: ${CONTENT_SERVICE_NAME:content-service}
  owner: ${CONTENT_SERVICE_OWNER:content-service}
  schema: ${CONTENT_SERVICE_SCHEMA:content_service}
  redis-namespace: ${CONTENT_SERVICE_REDIS_NAMESPACE:content}
  port: ${CONTENT_SERVICE_PORT:18089}

content:
  persistence:
    # disabled is deliberate: missing JDBC configuration must never become sample data.
    mode: ${CONTENT_PERSISTENCE_MODE:disabled}
    jdbc-url: ${CONTENT_JDBC_URL:}
    username: ${CONTENT_JDBC_USERNAME:}
    password: ${CONTENT_JDBC_PASSWORD:}
    driver-class-name: ${CONTENT_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
  events:
    relay:
      # Off by default: an unconfigured broker must not silently change delivery semantics, and the
      # deterministic suites keep running without a Kafka container.
      enabled: ${CONTENT_EVENT_RELAY_ENABLED:false}
      # Destination and broker come from the event runtime contract's topic table and the fixed
      # local port registry; the application never creates a topic (adminClientInApplication: false).
      topic: ${CONTENT_EVENT_TOPIC:platform.content.v1}
      bootstrap-servers: ${CONTENT_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
      instance-id: ${CONTENT_EVENT_RELAY_INSTANCE_ID:content-service}
      batch-size: ${CONTENT_EVENT_RELAY_BATCH_SIZE:100}
      lease: ${CONTENT_EVENT_RELAY_LEASE:30s}
      poll-interval: ${CONTENT_EVENT_RELAY_POLL_INTERVAL:5s}
      max-attempts: ${CONTENT_EVENT_RELAY_MAX_ATTEMPTS:5}
      base-delay: ${CONTENT_EVENT_RELAY_BASE_DELAY:1s}
      max-delay: ${CONTENT_EVENT_RELAY_MAX_DELAY:60s}

security:
  resource-server:
    # Every service independently verifies the IAM-owned JWT through JWKS.
    enabled: ${CONTENT_SERVICE_RESOURCE_SERVER_ENABLED:true}
    issuer-uri: ${CONTENT_SERVICE_SECURITY_ISSUER_URI:${IAM_JWT_ISSUER:http://127.0.0.1:18087}}
    jwk-set-uri: ${CONTENT_SERVICE_SECURITY_JWK_SET_URI:${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}}
    audience: ${CONTENT_SERVICE_SECURITY_AUDIENCE:${IAM_JWT_AUDIENCE:yuxuexing-api}}
