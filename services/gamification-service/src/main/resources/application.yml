spring:
  application:
    name: gamification-service
  lifecycle:
    timeout-per-shutdown-phase: ${GAMIFICATION_SHUTDOWN_TIMEOUT:20s}
  flyway:
    enabled: ${GAMIFICATION_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    schemas: ${GAMIFICATION_SCHEMA:gamification_service}
    default-schema: ${GAMIFICATION_SCHEMA:gamification_service}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GAMIFICATION_SECURITY_ISSUER_URI:${IAM_JWT_ISSUER:http://127.0.0.1:18087}}
          jwk-set-uri: ${GAMIFICATION_SECURITY_JWK_SET_URI:${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}}
          audiences: ${GAMIFICATION_SECURITY_AUDIENCE:${IAM_JWT_AUDIENCE:yuxuexing-api}}

server:
  address: ${GAMIFICATION_SERVER_ADDRESS:127.0.0.1}
  port: ${GAMIFICATION_SERVICE_PORT:18094}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}

service:
  name: gamification-service
  owner: gamification-service
  schema: ${GAMIFICATION_SCHEMA:gamification_service}
  redis-namespace: ${GAMIFICATION_REDIS_NAMESPACE:gamification}
  port: ${GAMIFICATION_SERVICE_PORT:18094}

gamification:
  feature:
    enabled: ${GAMIFICATION_FEATURE_ENABLED:true}
  default-time-zone: ${GAMIFICATION_DEFAULT_TIME_ZONE:Asia/Shanghai}
  local-feature-state-enabled: ${GAMIFICATION_LOCAL_FEATURE_STATE_ENABLED:true}
  events:
    consumer:
      # Off by default: a consumer that starts against an unconfigured broker must be
      # an explicit decision. Group/topic come from the event runtime contract's topic table.
      enabled: ${GAMIFICATION_EVENT_CONSUMER_ENABLED:false}
      group-id: ${GAMIFICATION_EVENT_CONSUMER_GROUP_ID:cg.gamification-from-learning.v1}
      topic: ${GAMIFICATION_EVENT_CONSUMER_TOPIC:platform.learning.v1}
      dlq-topic: ${GAMIFICATION_EVENT_CONSUMER_DLQ_TOPIC:platform.events.dlq.v1}
      bootstrap-servers: ${GAMIFICATION_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
  security:
    resource-server-enabled: ${GAMIFICATION_RESOURCE_SERVER_ENABLED:true}
    issuer-uri: ${GAMIFICATION_SECURITY_ISSUER_URI:${IAM_JWT_ISSUER:http://127.0.0.1:18087}}
    jwk-set-uri: ${GAMIFICATION_SECURITY_JWK_SET_URI:${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}}
    audience: ${GAMIFICATION_SECURITY_AUDIENCE:${IAM_JWT_AUDIENCE:yuxuexing-api}}
