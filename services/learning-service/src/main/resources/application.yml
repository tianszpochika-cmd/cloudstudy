spring:
  application:
    name: learning-service
  lifecycle:
    timeout-per-shutdown-phase: ${LEARNING_SHUTDOWN_TIMEOUT:20s}
  flyway:
    enabled: ${LEARNING_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    schemas: ${LEARNING_SCHEMA:learning_service}
    default-schema: ${LEARNING_SCHEMA:learning_service}

server:
  address: ${LEARNING_SERVICE_SERVER_ADDRESS:127.0.0.1}
  # Reserved for the B10 service; registration is intentionally local to this service slice.
  port: ${LEARNING_SERVICE_PORT:18090}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}

service:
  name: learning-service
  owner: learning-service
  schema: ${LEARNING_SCHEMA:learning_service}
  redis-namespace: ${LEARNING_REDIS_NAMESPACE:learning}
  port: ${LEARNING_SERVICE_PORT:18090}

learning:
  phase: ${LEARNING_PHASE:phase-1}
  srs-rules-version: ${LEARNING_SRS_RULES_VERSION:SM2_Q03_V1}
  persistence:
    # Allowed values: jdbc, memory-fixture, fail-closed. Default is deliberately fail-closed.
    mode: ${LEARNING_PERSISTENCE_MODE:fail-closed}
    jdbc-url: ${LEARNING_JDBC_URL:}
    username: ${LEARNING_JDBC_USERNAME:}
    password: ${LEARNING_JDBC_PASSWORD:}
    driver-class-name: ${LEARNING_JDBC_DRIVER:com.mysql.cj.jdbc.Driver}
  events:
    relay:
      # Off by default: an unconfigured broker must not silently change delivery semantics, and the
      # deterministic suites keep running without a Kafka container.
      enabled: ${LEARNING_EVENT_RELAY_ENABLED:false}
      # Destination and broker come from the event runtime contract's topic table and the fixed
      # local port registry; the application never creates a topic (adminClientInApplication: false).
      topic: ${LEARNING_EVENT_TOPIC:platform.learning.v1}
      bootstrap-servers: ${LEARNING_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:19092}
      instance-id: ${LEARNING_EVENT_RELAY_INSTANCE_ID:learning-service}
      batch-size: ${LEARNING_EVENT_RELAY_BATCH_SIZE:100}
      lease: ${LEARNING_EVENT_RELAY_LEASE:30s}
      poll-interval: ${LEARNING_EVENT_RELAY_POLL_INTERVAL:5s}
      max-attempts: ${LEARNING_EVENT_RELAY_MAX_ATTEMPTS:5}
      base-delay: ${LEARNING_EVENT_RELAY_BASE_DELAY:1s}
      max-delay: ${LEARNING_EVENT_RELAY_MAX_DELAY:60s}

security:
  resource-server:
    # Every service independently verifies the IAM-owned JWT through JWKS.
    enabled: ${LEARNING_RESOURCE_SERVER_ENABLED:true}
    issuer-uri: ${LEARNING_SECURITY_ISSUER_URI:${IAM_JWT_ISSUER:http://127.0.0.1:18087}}
    jwk-set-uri: ${LEARNING_SECURITY_JWK_SET_URI:${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}}
    audience: ${LEARNING_SECURITY_AUDIENCE:${IAM_JWT_AUDIENCE:yuxuexing-api}}
