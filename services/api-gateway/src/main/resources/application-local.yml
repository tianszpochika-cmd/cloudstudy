spring:
  config:
    activate:
      on-profile: local

# Local development must not make background OTLP metric export attempts.
management:
  otlp:
    metrics:
      export:
        enabled: false

gateway:
  b12:
    enabled: ${B12_SERVICES_ENABLED:true}
  b13:
    enabled: ${B13_SERVICES_ENABLED:true}
  b14:
    enabled: ${B14_STRANGLER_ENABLED:true}
    # TARGET is the only mode that resolves to a route. Every other mode makes b14Target return null,
    # which resolves the rule as unavailable, and routeBindings() drops unavailable resolutions, so
    # switching a domain to LEGACY, SHADOW or FALLBACK takes its canonical routes out of service and
    # they answer 404. That is a fail-closed withdrawal, not a rollback to a legacy path: the Gateway
    # registers no core-api or per-domain catch-all, and every canonical route rule in the contract is
    # compatibilityMode NONE. Measured on 2026-09-13 with the strangler enabled: /api/v1/learner/profile
    # answers 401 while learner is TARGET and 404 once it is FALLBACK, with other domains unaffected.
    route-modes:
      learner: ${B14_ROUTE_MODE_LEARNER:TARGET}
      content: ${B14_ROUTE_MODE_CONTENT:TARGET}
      learning: ${B14_ROUTE_MODE_LEARNING:TARGET}
      assessment: ${B14_ROUTE_MODE_ASSESSMENT:TARGET}
      media: ${B14_ROUTE_MODE_MEDIA:TARGET}
      gamification: ${B14_ROUTE_MODE_GAMIFICATION:TARGET}
      social: ${B14_ROUTE_MODE_SOCIAL:TARGET}
      commerce: ${B14_ROUTE_MODE_COMMERCE:TARGET}
  rate-limit:
    # Local-only single-process limiter. It is useful for development tests but
    # is never evidence of distributed Redis behaviour.
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    backend: ${GATEWAY_RATE_LIMIT_BACKEND:memory}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:false}
