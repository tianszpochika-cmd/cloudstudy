spring:
  application:
    name: ${GATEWAY_SERVICE_ID:api-gateway}
  main:
    web-application-type: reactive
    banner-mode: off
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:16379}
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      metrics:
        enabled: true
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:1000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  # The default is the registered fixed port; deployments may override it explicitly,
  # but this service never auto-increments or chooses a random port.
  port: ${API_GATEWAY_PORT:18070}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_EXPORT_ENABLED:false}
  opentelemetry:
    enabled: ${OTEL_ENABLED:true}
    map-environment-variables: true
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}}

gateway:
  identity:
    enabled: ${IAM_ROUTE_ENABLED:true}
    iam-base-url: ${IAM_SERVICE_BASE_URL:http://127.0.0.1:18087}
  b12:
    # Domain routes are activated only by an explicit deployment/integration
    # profile after the corresponding service PEP is accepted.
    enabled: ${B12_SERVICES_ENABLED:false}
    gamification-base-url: ${GAMIFICATION_SERVICE_BASE_URL:http://127.0.0.1:18094}
    social-base-url: ${SOCIAL_SERVICE_BASE_URL:http://127.0.0.1:18095}
    notification-base-url: ${NOTIFICATION_SERVICE_BASE_URL:http://127.0.0.1:18093}
  b13:
    enabled: ${B13_SERVICES_ENABLED:false}
    commerce-base-url: ${COMMERCE_SERVICE_BASE_URL:http://127.0.0.1:18096}
    admin-ops-base-url: ${ADMIN_OPS_SERVICE_BASE_URL:http://127.0.0.1:18097}
    analytics-base-url: ${ANALYTICS_SERVICE_BASE_URL:http://127.0.0.1:18098}
  workflow:
    # P1R decision 1A: recovery console route owner. Same loopback-default
    # shape as B12/B13; enabled by the local stack runner.
    enabled: ${WORKFLOW_SERVICES_ENABLED:false}
    workflow-base-url: ${WORKFLOW_SERVICE_BASE_URL:http://127.0.0.1:18071}
  b14:
    enabled: ${B14_STRANGLER_ENABLED:false}
    # Reserved, and deliberately off. A domain in any mode other than TARGET resolves to no route at
    # all, and every canonical route rule in the contract is compatibilityMode NONE, so no reachable
    # route is ever deprecated and nothing can emit the headers. Defaulting this to true advertised a
    # behaviour that does not exist. Turn it on together with the code that emits the headers.
    deprecation-headers-enabled: ${B14_DEPRECATION_HEADERS_ENABLED:false}
    deprecation-sunset-at: ${B14_DEPRECATION_SUNSET_AT:2027-06-30T00:00:00Z}
    service-base-urls:
      learner: ${LEARNER_SERVICE_BASE_URL:http://127.0.0.1:18088}
      content: ${CONTENT_SERVICE_BASE_URL:http://127.0.0.1:18089}
      learning: ${LEARNING_SERVICE_BASE_URL:http://127.0.0.1:18090}
      assessment: ${ASSESSMENT_SERVICE_BASE_URL:http://127.0.0.1:18091}
      media: ${MEDIA_SERVICE_BASE_URL:http://127.0.0.1:18092}
      gamification: ${GAMIFICATION_SERVICE_BASE_URL:http://127.0.0.1:18094}
      social: ${SOCIAL_SERVICE_BASE_URL:http://127.0.0.1:18095}
      commerce: ${COMMERCE_SERVICE_BASE_URL:http://127.0.0.1:18096}
    route-modes:
      learner: ${B14_ROUTE_MODE_LEARNER:TARGET}
      content: ${B14_ROUTE_MODE_CONTENT:TARGET}
      learning: ${B14_ROUTE_MODE_LEARNING:TARGET}
      assessment: ${B14_ROUTE_MODE_ASSESSMENT:TARGET}
      media: ${B14_ROUTE_MODE_MEDIA:TARGET}
      gamification: ${B14_ROUTE_MODE_GAMIFICATION:TARGET}
      social: ${B14_ROUTE_MODE_SOCIAL:TARGET}
      commerce: ${B14_ROUTE_MODE_COMMERCE:TARGET}
  compatibility:
    # Reserved migration settings only. No compatibility route is registered
    # by the canonical RouteLocator, and the default must stay fail closed.
    enabled: ${CORE_API_COMPAT_ENABLED:false}
    core-api-base-url: ${CORE_API_BASE_URL:http://127.0.0.1:18080}
    anonymous-read-enabled: false
  cors:
    # The browser profiles map exactly to the M1-004 boundary.  Keep legacy
    # variable aliases only as a migration input; the profile-specific values
    # below are what the Gateway enforces.
    learner-web-origin: ${CORS_ALLOWED_ORIGIN_LEARNER_WEB:${CORS_ALLOWED_ORIGIN_LEARNER:http://127.0.0.1:18180}}
    admin-web-origin: ${CORS_ALLOWED_ORIGIN_ADMIN_WEB:${CORS_ALLOWED_ORIGIN_ADMIN:http://127.0.0.1:18181}}
    mobile-h5-origin: ${CORS_ALLOWED_ORIGIN_MOBILE_H5:${CORS_ALLOWED_ORIGIN_MOBILE:http://127.0.0.1:18183}}
    official-site-origin: ${CORS_ALLOWED_ORIGIN_OFFICIAL_SITE:${CORS_ALLOWED_ORIGIN_OFFICIAL:http://127.0.0.1:18182}}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    # Keep this list in lock-step with the shared client envelope.  These are
    # non-safelisted headers emitted by learner-web/mobile for tenant-safe
    # device context, locale negotiation, snapshots and request tracing.
    # If-Match is the plan replan optimistic-lock header. Without it the
    # browser preflight fails and plans:replan never leaves the page.
    credentialed-allowed-headers: Authorization,Content-Type,Idempotency-Key,If-Match,X-Request-Id,X-Trace-Id,X-Device-Id,X-Client-Version,X-Timezone,X-UI-Locale,X-Content-Locale,X-Snapshot-Id,X-Performance-Level,traceparent,X-Auth-Transport
    public-allowed-headers: Content-Type,X-Request-Id,X-Trace-Id,X-UI-Locale,X-Content-Locale,traceparent
    exposed-headers: X-Request-Id,X-Trace-Id,Retry-After
    refresh-cookie-name: ${IAM_REFRESH_COOKIE_NAME:yuxuexing_refresh}
    native-auth-transport: NATIVE_SECURE_STORAGE
    max-age: 30m
  rate-limit:
    # Non-local operation defaults to distributed Redis and fails closed. The
    # local profile below is the explicit one-process development exception.
    enabled: ${GATEWAY_RATE_LIMIT_ENABLED:true}
    backend: ${GATEWAY_RATE_LIMIT_BACKEND:redis}
    max-keys: ${GATEWAY_RATE_LIMIT_MAX_KEYS:10000}
    fail-open: ${GATEWAY_RATE_LIMIT_FAIL_OPEN:false}
    # Bound every Redis admission operation so an unavailable Lettuce connection
    # cannot keep a Gateway request open while it retries in the background.
    backend-timeout: ${GATEWAY_RATE_LIMIT_BACKEND_TIMEOUT:750ms}
    policies:
      public-read:
        requests-per-window: ${GATEWAY_RATE_LIMIT_PUBLIC_READ_REQUESTS:${GATEWAY_RATE_LIMIT_REQUESTS:240}}
        window: ${GATEWAY_RATE_LIMIT_PUBLIC_READ_WINDOW:${GATEWAY_RATE_LIMIT_WINDOW:1m}}
      auth-register:
        requests-per-window: ${GATEWAY_RATE_LIMIT_AUTH_REGISTER_REQUESTS:20}
        window: ${GATEWAY_RATE_LIMIT_AUTH_REGISTER_WINDOW:1m}
      auth-login:
        requests-per-window: ${GATEWAY_RATE_LIMIT_AUTH_LOGIN_REQUESTS:10}
        window: ${GATEWAY_RATE_LIMIT_AUTH_LOGIN_WINDOW:1m}
      auth-refresh:
        requests-per-window: ${GATEWAY_RATE_LIMIT_AUTH_REFRESH_REQUESTS:30}
        window: ${GATEWAY_RATE_LIMIT_AUTH_REFRESH_WINDOW:1m}
      password-reset:
        requests-per-window: ${GATEWAY_RATE_LIMIT_PASSWORD_RESET_REQUESTS:10}
        window: ${GATEWAY_RATE_LIMIT_PASSWORD_RESET_WINDOW:1m}
      authenticated-read:
        requests-per-window: ${GATEWAY_RATE_LIMIT_AUTHENTICATED_READ_REQUESTS:180}
        window: ${GATEWAY_RATE_LIMIT_AUTHENTICATED_READ_WINDOW:1m}
      authenticated-write:
        requests-per-window: ${GATEWAY_RATE_LIMIT_AUTHENTICATED_WRITE_REQUESTS:90}
        window: ${GATEWAY_RATE_LIMIT_AUTHENTICATED_WRITE_WINDOW:1m}
      high-risk-admin:
        requests-per-window: ${GATEWAY_RATE_LIMIT_HIGH_RISK_ADMIN_REQUESTS:30}
        window: ${GATEWAY_RATE_LIMIT_HIGH_RISK_ADMIN_WINDOW:1m}
      provider-callback:
        requests-per-window: ${GATEWAY_RATE_LIMIT_PROVIDER_CALLBACK_REQUESTS:120}
        window: ${GATEWAY_RATE_LIMIT_PROVIDER_CALLBACK_WINDOW:1m}
  request-context:
    max-id-length: 128
  security:
    # Gateway always validates the IAM-owned JWT with the explicit public JWKS endpoint.
    jwt-prevalidation-enabled: ${GATEWAY_JWT_PREVALIDATION_ENABLED:true}
    resource-server-enabled: ${GATEWAY_RESOURCE_SERVER_ENABLED:true}
    audit-enabled: ${GATEWAY_SECURITY_AUDIT_ENABLED:true}
    issuer-uri: ${IAM_JWT_ISSUER:http://127.0.0.1:18087}
    audience: ${IAM_JWT_AUDIENCE:yuxuexing-api}
    jwk-set-uri: ${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}
  # Durable security audit. All four are empty by default, which leaves the bounded in-memory sink in place and the
  # behaviour as it was. Setting all four sends the redacted envelope to the canonical ingest, authenticated with a
  # short-lived service token from IAM (ADR-0016). A separate prefix from gateway.security because that record cannot
  # carry optional components: see GatewayAuditProperties.
  audit:
    ingest-uri: ${GATEWAY_AUDIT_INGEST_URI:}
    service-token-uri: ${GATEWAY_AUDIT_SERVICE_TOKEN_URI:}
    service-client-id: ${GATEWAY_AUDIT_SERVICE_CLIENT_ID:}
    service-client-secret: ${GATEWAY_AUDIT_SERVICE_CLIENT_SECRET:}
