spring:
  application:
    name: assessment-service
  flyway:
    enabled: ${ASSESSMENT_FLYWAY_ENABLED:${ASSESSMENT_PERSISTENCE_ENABLED:false}}
    default-schema: ${ASSESSMENT_SCHEMA:assessment_service}
    schemas: ${ASSESSMENT_SCHEMA:assessment_service}
    create-schemas: ${ASSESSMENT_DB_CREATE_SCHEMA:false}
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: ${ASSESSMENT_SHUTDOWN_TIMEOUT:20s}

server:
  address: ${ASSESSMENT_SERVICE_SERVER_ADDRESS:127.0.0.1}
  port: ${ASSESSMENT_SERVICE_PORT:18091}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_ENABLED:false}

service:
  name: assessment-service
  owner: assessment-service
  schema: ${ASSESSMENT_SCHEMA:assessment_service}
  redis-namespace: ${ASSESSMENT_REDIS_NAMESPACE:assessment}
  port: ${ASSESSMENT_SERVICE_PORT:18091}

assessment:
  phase: ${ASSESSMENT_PHASE:phase-1}
  persistence:
    enabled: ${ASSESSMENT_PERSISTENCE_ENABLED:false}
    schema: ${ASSESSMENT_SCHEMA:assessment_service}
    jdbc-url: ${ASSESSMENT_DB_URL:}
    username: ${ASSESSMENT_DB_USERNAME:}
    password: ${ASSESSMENT_DB_PASSWORD:}
    driver-class-name: ${ASSESSMENT_DB_DRIVER:com.mysql.cj.jdbc.Driver}
    tolerate-corrupt-legacy-rows: ${ASSESSMENT_TOLERATE_CORRUPT_LEGACY_ROWS:false}
  scoring:
    client-visible: false
  placement:
    bank:
      # Canonical ten-item bank via content-service sealed endpoint + learner target pin.
      # enabled=false restores the explicit unavailable port (independent rollback).
      enabled: ${ASSESSMENT_PLACEMENT_BANK_ENABLED:true}
      content-base-url: ${ASSESSMENT_PLACEMENT_BANK_CONTENT_BASE_URL:http://127.0.0.1:18089}
      learner-base-url: ${ASSESSMENT_PLACEMENT_BANK_LEARNER_BASE_URL:http://127.0.0.1:18088}

security:
  resource-server:
    # Every service independently verifies the IAM-owned JWT through JWKS.
    enabled: ${ASSESSMENT_RESOURCE_SERVER_ENABLED:true}
    issuer-uri: ${ASSESSMENT_SECURITY_ISSUER_URI:${IAM_JWT_ISSUER:http://127.0.0.1:18087}}
    jwk-set-uri: ${ASSESSMENT_SECURITY_JWK_SET_URI:${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}}
    audience: ${ASSESSMENT_SECURITY_AUDIENCE:${IAM_JWT_AUDIENCE:yuxuexing-api}}
