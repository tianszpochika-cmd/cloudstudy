spring:
  application:
    name: ${service.name}
  lifecycle:
    timeout-per-shutdown-phase: ${SERVICE_SHUTDOWN_TIMEOUT:20s}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${service.port}
  shutdown: graceful
  ssl:
    # mTLS is disabled until the deployment platform injects a service certificate and trust
    # store. Never commit the stores or their passwords to the repository.
    enabled: ${SERVICE_MTLS_ENABLED:false}
    client-auth: ${SERVICE_MTLS_CLIENT_AUTH:need}
    key-store: ${SERVICE_MTLS_KEY_STORE:}
    key-store-password: ${SERVICE_MTLS_KEY_STORE_PASSWORD:}
    trust-store: ${SERVICE_MTLS_TRUST_STORE:}
    trust-store-password: ${SERVICE_MTLS_TRUST_STORE_PASSWORD:}
    key-store-type: ${SERVICE_MTLS_KEY_STORE_TYPE:PKCS12}
    trust-store-type: ${SERVICE_MTLS_TRUST_STORE_TYPE:PKCS12}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      validate-group-membership: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  tracing:
    propagation:
      type: W3C
    sampling:
      probability: ${OTEL_TRACING_SAMPLING_PROBABILITY:0.1}
    export:
      enabled: ${OTEL_TRACING_ENABLED:true}
      otlp:
        enabled: ${OTEL_TRACING_EXPORT_ENABLED:true}
  opentelemetry:
    map-environment-variables: true
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:4318/v1/traces}}

logging:
  include-application-name: false
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-},%X{requestId:-}] "

service:
  # These are deliberate fail-fast placeholders. Replace through environment or config.
  name: ${SERVICE_NAME:}
  owner: ${SERVICE_OWNER:}
  schema: ${SERVICE_SCHEMA:}
  redis-namespace: ${SERVICE_REDIS_NAMESPACE:}
  port: ${SERVICE_PORT:0}

security:
  resource-server:
    # The template independently verifies the IAM-owned JWT through explicit JWKS.
    enabled: ${SERVICE_RESOURCE_SERVER_ENABLED:true}
    issuer-uri: ${SERVICE_SECURITY_ISSUER_URI:${IAM_JWT_ISSUER:http://127.0.0.1:18087}}
    jwk-set-uri: ${SERVICE_SECURITY_JWK_SET_URI:${IAM_JWT_JWKS_URI:http://127.0.0.1:18087/api/v1/auth/jwks}}
    audience: ${SERVICE_SECURITY_AUDIENCE:${IAM_JWT_AUDIENCE:yuxuexing-api}}
    policy-cache-ttl: ${SERVICE_POLICY_CACHE_TTL:30s}
    pdp-timeout: ${SERVICE_PDP_TIMEOUT:250ms}
  workload-identity:
    enabled: ${SERVICE_WORKLOAD_IDENTITY_ENABLED:false}
    required: ${SERVICE_WORKLOAD_IDENTITY_REQUIRED:false}
    service-id: ${SERVICE_WORKLOAD_IDENTITY_SERVICE_ID:${SERVICE_NAME:}}
    allowed-callers: ${SERVICE_WORKLOAD_ALLOWED_CALLERS:}
    key-store: ${SERVICE_MTLS_KEY_STORE:}
    trust-store: ${SERVICE_MTLS_TRUST_STORE:}
