packages:
  - apps/*
  - services/*
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - core-js
  - esbuild
  - vue-demi

publicHoistPattern:
  # Vite 8 bundles with Rolldown and the uni-app plugin pins preserveSymlinks: true
  # (see @dcloudio/vite-plugin-uni/dist/config/resolve.js), so module ids stay on the
  # symlinked path (apps/mobile/node_modules/pinia/dist/pinia.mjs) instead of the real
  # store path. pinia's own runtime dependencies are therefore not resolvable under
  # pnpm's isolated layout. These are exactly pinia 2.3.1's runtime dependencies other
  # than vue; hoisting only them keeps every other package isolated.
  - '*vue-demi*'
  - '*@vue/devtools-api*'

overrides:
  # Moved here from package.json#pnpm.overrides during the P1R-M0-006 route-3 migration. This is a
  # relocation, not a repair: the pins were in effect before the move, because the pre-migration
  # pnpm-lock.yaml carried an overrides: section with exactly these entries. pnpm 10 reads the
  # workspace file as the recommended location, so the pins now live in one workspace-level file
  # rather than in one project's manifest, and nothing was ever silently ignored.
  #
  # Verify by reading the resolved versions out of pnpm-lock.yaml. Do not use
  # `pnpm config get overrides`: it reports only the workspace-file source and returns undefined for
  # overrides coming from package.json, even while those overrides are in effect.
  express>path-to-regexp: 0.1.13
  '@dcloudio/uni-nvue-styler>postcss': 8.5.23
  # adm-zip 0.6.0 was the affected upper bound for GHSA-xcpc-8q44-7q3c; 0.6.1 is published and
  # outside it. Raised from 0.6.0 on 2026-09-13.
  '@dcloudio/uni-cli-shared>adm-zip': 0.6.1
  '@dcloudio/uni-cli-shared>@intlify/core-base': 9.1.11
  '@intlify/message-resolver': 9.1.11
  # GHSA-w27v-7q3p-w38r (high) / GHSA-4vpr-x523-8j87 (moderate): svgo < 4.1.0 lets
  # removeScripts be bypassed. Reached in production through
  # official-site > nuxt > @nuxt/vite-builder > cssnano > postcss-svgo.
  svgo: '>=4.1.0'
