name: ci

on:
  pull_request:
  push:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  governance:
    name: Governance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - name: Frozen workspace install
        run: pnpm install --frozen-lockfile
      - name: CI policy guard
        run: pnpm p1r:ci:check
      - name: Static toolchain and version governance
        run: pnpm p1r:toolchain:static
      - name: Runtime toolchain diagnostics
        run: pnpm p1r:toolchain:check
      - name: Fixed port diagnostics
        run: pnpm ports:check

  contracts-and-data:
    name: Contracts and data boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: governance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm plan:p1r:check
      - run: pnpm p1r:evidence:check
      - run: pnpm test:p1r
      - run: pnpm p1r:fixtures:validate
      - run: pnpm p1r:fixtures:audit
      - run: pnpm contracts:merge:check
      - run: pnpm contracts:generate:check
      - run: pnpm contracts:validate
      - run: pnpm contracts:compatibility:git -- --ref 463c4b238caceb1592bff6c61327c00ab9bac922 --kind all --json
      - run: pnpm db:validate
      - run: pnpm redis:validate
      - run: pnpm config:check

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  backend-v2:
    name: Java 25 v2 service tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f pom.xml test

  legacy-core-api:
    name: Java 17 compatibility tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress -f services/core-api/pom.xml test

  supply-chain:
    name: Lock, licenses, vulnerabilities and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: governance
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.5
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: browser-actions/setup-chrome@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm p1r:supply-chain:check
      - name: Upload dependency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1r-m0-supply-chain
          path: |
            evidence/p1r/m0/devex/
            target/bom.json
          if-no-files-found: error
