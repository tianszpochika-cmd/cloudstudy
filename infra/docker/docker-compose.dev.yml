services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: yuxuexing
      MYSQL_USER: yuxuexing
      MYSQL_PASSWORD: yuxuexing
      MYSQL_ROOT_PASSWORD: root-local-only
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - yuxuexing-mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - yuxuexing-minio:/data

volumes:
  yuxuexing-mysql:
  yuxuexing-minio:
