services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: englishflow
      POSTGRES_PASSWORD: englishflow
      POSTGRES_DB: englishflow
    ports:
      - "5432:5432"
    volumes:
      - englishflow-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: change-me
      MINIO_ROOT_PASSWORD: change-me-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - englishflow-minio:/data

volumes:
  englishflow-postgres:
  englishflow-minio:
