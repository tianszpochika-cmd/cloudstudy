# HTTP baseline for the clyunedev single-host pre-release environment.
#
# Install this file as /etc/nginx/sites-available/clyunedev before requesting
# the Let's Encrypt certificate. Certbot may add the TLS listener and redirect
# directives to the installed copy; do not expose container ports directly.

server {
  listen 80;
  listen [::]:80;
  server_name clyunedev.com;

  server_tokens off;
  client_max_body_size 100m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://127.0.0.1:18182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
  }
}

