# Static v2 frontend demos hub.
# Insert INSIDE learn.clyune.com and learn.clyunedev.com server blocks
# BEFORE the catch-all "location /" reverse-proxy. Leaves learner app routes intact.
#
# Files live at: /srv/cloudstudy/static/webDemo/
# Public: https://learn.clyune.com/webDemo/  and  https://learn.clyunedev.com/webDemo/

location ^~ /webDemo/ {
  root /srv/cloudstudy/static;
  index index.html;
  add_header Cache-Control "no-cache";
  add_header X-Content-Type-Options nosniff;
  try_files $uri $uri/ =404;
}
