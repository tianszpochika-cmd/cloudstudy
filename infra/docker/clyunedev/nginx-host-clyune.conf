# clyune.com: second public domain family for the same clyunedev deployment.
# Install as /etc/nginx/sites-available/clyune, then:
#   certbot --nginx --cert-name clyune -d clyune.com -d www.clyune.com -d learn.clyune.com \
#     -d admin.clyune.com -d mobile.clyune.com -d api.clyune.com --redirect
# certbot adds the 443 listeners and keeps them renewed via certbot.timer.

server {
  listen 80;
  listen [::]:80;
  server_name clyune.com www.clyune.com;

  server_tokens off;
  client_max_body_size 100m;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    proxy_pass http://127.0.0.1:18182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    # The official-site build bakes clyunedev.com links; keep visitors on clyune.com.
    proxy_set_header Accept-Encoding "";
    sub_filter_once off;
    sub_filter_types text/html application/javascript application/json;
    sub_filter 'clyunedev.com' 'clyune.com';
  }
}

server {
  listen 80;
  listen [::]:80;
  server_name learn.clyune.com;

  server_tokens off;
  client_max_body_size 100m;

  location ^~ /.well-known/acme-challenge/ {
